<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Words</title>
<style>
  :root{
    --ink:#021024; --deep:#052659; --mid:#5483B3; --soft:#7DA0CA; --ice:#C1E8FF;
    --bg-a:#021024; --bg-b:#021024;
    --glow-a:rgba(84,131,179,.42); --glow-b:rgba(5,38,89,.95);
    --card-a:#052659; --card-b:#021024; --card-border:rgba(84,131,179,.55);
    --halo:rgba(84,131,179,.22); --shadow:rgba(0,0,0,.55); --shadow2:rgba(0,0,0,.35);
    --hl:rgba(193,232,255,.14);
    --hair:rgba(84,131,179,.30); --ghost:rgba(193,232,255,.05); --action-bg:#052659;
    --field-bg:rgba(2,16,36,.55); --overlay:rgba(2,16,36,.78);
    --btn-a:#5483B3; --btn-b:#052659; --btn-ink:#FFFFFF; --btn-border:rgba(193,232,255,.40);
    --btn2-a:#052659; --btn2-b:#021024; --btn2-ink:#C1E8FF; --btn2-border:rgba(125,160,202,.55);
    --saved-a:#7DA0CA; --saved-b:#5483B3; --saved-ink:#021024;
    --nav-bg-a:rgba(84,131,179,.30); --nav-bg-b:rgba(5,38,89,.70); --nav-ink:#C1E8FF;
    --nav-border:rgba(125,160,202,.45); --nav-hover-a:rgba(125,160,202,.45); --nav-hover-b:rgba(5,38,89,.75);
    --head-ink:#C1E8FF; --title-ink:#FFFFFF; --title-glow:rgba(125,160,202,.5); --head-rule:rgba(125,160,202,.9);
    --label:#7DA0CA; --page-label:#7DA0CA; --label-rule:rgba(84,131,179,.75); --ref-ink:#7DA0CA;
    --on-card:#FFFFFF; --aff-ink:#C1E8FF; --act-ink:#C1E8FF;
    --tex:none; --tex-card:none;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:
      var(--tex),
      radial-gradient(ellipse 95% 52% at 50% -10%, var(--glow-a), rgba(0,0,0,0) 62%),
      radial-gradient(ellipse 85% 42% at 50% 112%, var(--glow-b), rgba(0,0,0,0) 70%),
      linear-gradient(180deg, var(--bg-a), var(--bg-b));
    background-attachment:fixed;
    color:var(--head-ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 40px;
  }
  .frame{width:100%;max-width:580px;}
  header{
    text-align:center;
    color:var(--head-ink);
    padding:26px 8px 6px;
  }
  header::after{
    content:"";
    display:block;
    width:180px;
    height:1px;
    margin:18px auto 0;
    background:linear-gradient(90deg, rgba(0,0,0,0), var(--head-rule), rgba(0,0,0,0));
  }
  header h1{
    font-size:2.2rem;
    letter-spacing:.16em;
    color:var(--title-ink);
    font-weight:normal;
    text-shadow:0 2px 22px var(--title-glow);
  }
  header .dateline{
    margin-top:10px;
    font-size:1rem;
    letter-spacing:.03em;
    color:var(--head-ink);
  }
  header .theme{
    margin-top:7px;
    font-size:.78rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--page-label);
  }
  .themebar{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    justify-content:center;
    margin:16px 0 0;
  }
  .tchip{
    font-family:inherit;
    font-size:.82rem;
    letter-spacing:.06em;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    background:linear-gradient(180deg, var(--nav-bg-a), var(--nav-bg-b));
    color:var(--nav-ink);
    border:1px solid var(--nav-border);
    box-shadow:0 3px 10px var(--shadow2), inset 0 1px 0 var(--hl);
    transition:background .2s, transform .12s;
  }
  .tchip:active{transform:translateY(1px);}
  .tchip.on{
    background:linear-gradient(180deg, var(--btn-a), var(--btn-b));
    color:var(--btn-ink);
    border-color:var(--btn-border);
    font-weight:bold;
  }
  .schemebar{
    display:none;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:11px;
  }
  .schemebar button{
    font-family:inherit;
    width:32px;
    height:32px;
    border-radius:50%;
    padding:0;
    font-size:1.05rem;
    line-height:1;
    cursor:pointer;
    background:linear-gradient(180deg, var(--nav-bg-a), var(--nav-bg-b));
    color:var(--nav-ink);
    border:1px solid var(--nav-border);
    box-shadow:0 3px 10px var(--shadow2), inset 0 1px 0 var(--hl);
  }
  .schemebar button:active{transform:translateY(1px);}
  #schemeName{
    font-size:.8rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--page-label);
  }
  nav.bar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    align-items:center;
    margin:16px 0 18px;
  }
  nav.bar button, .jump button{
    font-family:inherit;
    background:linear-gradient(180deg, var(--nav-bg-a), var(--nav-bg-b));
    color:var(--nav-ink);
    border:1px solid var(--nav-border);
    border-radius:10px;
    padding:9px 15px;
    font-size:.9rem;
    cursor:pointer;
    box-shadow:0 4px 14px var(--shadow2), inset 0 1px 0 var(--hl);
    transition:background .2s, transform .12s, box-shadow .12s;
  }
  nav.bar button:hover, .jump button:hover{
    background:linear-gradient(180deg, var(--nav-hover-a), var(--nav-hover-b));
    transform:translateY(-1px);
  }
  nav.bar button:active, .jump button:active{
    transform:translateY(1px);
    box-shadow:0 2px 8px var(--shadow2), inset 0 2px 6px rgba(0,0,0,.3);
  }
  .jump{display:flex;gap:6px;align-items:center;}
  .jump input{
    font-family:inherit;
    width:74px;
    padding:9px;
    border-radius:10px;
    border:1px solid var(--nav-border);
    background:var(--field-bg);
    color:var(--nav-ink);
    color-scheme:dark;
    font-size:.9rem;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.3);
  }
  body[data-theme="papyrus"] .jump input{color-scheme:light;}
  .jump input::placeholder{color:var(--page-label);}
  .jump input[type="date"]{width:150px;}
  button:focus-visible, input:focus-visible{outline:2px solid var(--label);outline-offset:2px;}
  .card{
    position:relative;
    background:
      var(--tex-card),
      linear-gradient(168deg, var(--card-a), var(--card-b));
    border:1px solid var(--card-border);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 26px 60px var(--shadow), 0 0 90px var(--halo), inset 0 1px 0 var(--hl);
  }
  body[data-theme="metal"] .card{
    background-size:230% 100%;
    animation:cardSheen 11s ease-in-out infinite alternate;
  }
  @keyframes cardSheen{
    from{background-position:0% 0;}
    to{background-position:100% 0;}
  }
  .sealrow{
    display:none;
    justify-content:flex-end;
    padding:16px 20px 0;
  }
  body[data-theme="papyrus"] .sealrow{display:flex;}
  .seal{
    width:78px;
    height:78px;
    transform:rotate(-8deg);
    filter:drop-shadow(0 4px 6px rgba(43,30,12,.45));
  }
  .seal svg{display:block;width:100%;height:100%;}
  section.block{padding:30px 32px;}
  section.block + section.block{border-top:1px solid var(--hair);}
  .block h2{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:.74rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--label);
    margin-bottom:16px;
    font-weight:bold;
  }
  .block h2::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--label-rule), rgba(0,0,0,0));
  }
  .verse-text{
    font-size:1.48rem;
    line-height:1.62;
    color:var(--on-card);
  }
  .verse-ref{
    position:relative;
    margin-top:26px;
    padding-top:22px;
    font-size:.84rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ref-ink);
  }
  .verse-ref::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:168px;
    height:1px;
    background:linear-gradient(90deg, var(--head-rule), rgba(0,0,0,0));
  }
  .verse-ref::after{
    content:"";
    position:absolute;
    top:-4px;
    left:80px;
    width:8px;
    height:8px;
    background:var(--mid);
    transform:rotate(45deg);
    box-shadow:0 0 10px var(--title-glow);
  }
  section.affirmation{background:var(--ghost);}
  .affirmation-text{
    font-size:1.1rem;
    line-height:1.75;
    color:var(--aff-ink);
  }
  .action-text{
    background:var(--action-bg);
    border-left:3px solid var(--mid);
    border-radius:10px;
    padding:18px 20px;
    font-size:1.08rem;
    line-height:1.65;
    color:var(--act-ink);
    box-shadow:inset 0 1px 0 var(--hl), 0 10px 24px var(--shadow2);
  }
  @media (max-width:480px){
    section.block{padding:25px 22px;}
    header h1{font-size:1.9rem;}
    .verse-text{font-size:1.36rem;}
  }
  footer.actions{
    display:flex;
    gap:12px;
    margin-top:18px;
  }
  footer.actions button{
    flex:1;
    font-family:inherit;
    font-size:1.02rem;
    letter-spacing:.05em;
    padding:15px;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 10px 24px var(--shadow2), inset 0 1px 0 var(--hl);
    transition:transform .12s, box-shadow .12s, background .2s;
  }
  footer.actions button:active{
    transform:translateY(1px);
    box-shadow:0 4px 12px var(--shadow2), inset 0 2px 6px rgba(0,0,0,.3);
  }
  #shareBtn{background:linear-gradient(180deg, var(--btn-a), var(--btn-b));color:var(--btn-ink);border:1px solid var(--btn-border);}
  #shareBtn:hover{filter:brightness(1.08);}
  #saveBtn{background:linear-gradient(180deg, var(--btn2-a), var(--btn2-b));color:var(--btn2-ink);border:1px solid var(--btn2-border);}
  #saveBtn:hover{filter:brightness(1.06);}
  #saveBtn.saved{
    background:linear-gradient(180deg, var(--saved-a), var(--saved-b));
    color:var(--saved-ink);
    border:1px solid var(--btn-border);
    font-weight:bold;
  }
  .savedlink{
    margin-top:16px;
    text-align:center;
  }
  .savedlink button{
    background:none;border:none;color:var(--label);
    font-family:inherit;font-size:.92rem;cursor:pointer;
    text-decoration:underline;
  }
  .savedlink button:hover{color:var(--head-ink);}
  #savedView{
    display:none;margin-top:16px;
    background:
      var(--tex-card),
      linear-gradient(168deg, var(--card-a), var(--card-b));
    border:1px solid var(--card-border);
    border-radius:18px;padding:22px 24px;
    box-shadow:0 20px 44px var(--shadow2), inset 0 1px 0 var(--hl);
  }
  #savedView h2{font-size:1rem;color:var(--on-card);letter-spacing:.08em;margin-bottom:10px;font-weight:normal;}
  #savedView .empty{color:var(--label);font-size:.95rem;line-height:1.5;}
  .saved-item{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:11px 4px;border-top:1px solid var(--hair);
  }
  .saved-item .open{
    background:none;border:none;font-family:inherit;text-align:left;cursor:pointer;
    color:var(--aff-ink);font-size:.98rem;flex:1;
  }
  .saved-item .open:hover{color:var(--on-card);}
  .saved-item .unsave{
    background:var(--field-bg);border:1px solid var(--nav-border);border-radius:8px;
    font-family:inherit;font-size:.8rem;padding:6px 10px;cursor:pointer;color:var(--nav-ink);
  }
  .saved-item .unsave:hover{border-color:var(--label);}
  .share-menu{
    position:fixed;inset:0;background:var(--overlay);
    display:none;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .share-menu.open{display:flex;}
  .share-box{
    background:
      var(--tex-card),
      linear-gradient(165deg, var(--card-a), var(--card-b));
    border:1px solid var(--card-border);
    border-radius:18px;padding:24px;width:100%;max-width:340px;
    box-shadow:0 24px 60px var(--shadow), inset 0 1px 0 var(--hl);
  }
  .share-box h2{font-size:1.1rem;color:var(--on-card);margin-bottom:6px;font-weight:normal;letter-spacing:.05em;}
  .share-box p{font-size:.9rem;color:var(--label);margin-bottom:14px;line-height:1.5;}
  .share-box button{
    display:block;width:100%;font-family:inherit;font-size:1rem;padding:13px;
    border-radius:11px;cursor:pointer;margin-top:9px;letter-spacing:.04em;
    box-shadow:0 8px 20px var(--shadow2), inset 0 1px 0 var(--hl);
    transition:transform .12s, background .2s;
  }
  .share-box button:active{transform:translateY(1px);}
  #shareTextBtn{background:linear-gradient(180deg, var(--btn-a), var(--btn-b));color:var(--btn-ink);border:1px solid var(--btn-border);}
  #sharePicBtn{background:linear-gradient(180deg, var(--btn2-a), var(--btn2-b));color:var(--btn2-ink);border:1px solid var(--btn2-border);}
  #shareCancelBtn{background:var(--field-bg);color:var(--label);border:1px solid var(--hair);box-shadow:none;}
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:linear-gradient(180deg, var(--btn2-a), var(--btn2-b));
    border:1px solid var(--btn2-border);
    box-shadow:0 12px 30px var(--shadow2);
    color:var(--btn2-ink);padding:11px 19px;border-radius:10px;
    font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1>My Words</h1>
    <div class="dateline" id="dateline"></div>
    <div class="theme" id="themeLine"></div>
  </header>

  <div class="themebar" role="group" aria-label="Theme">
    <button type="button" class="tchip" data-set-theme="river">River Blue</button>
    <button type="button" class="tchip" data-set-theme="rot24">24 Colors</button>
    <button type="button" class="tchip" data-set-theme="metal">Metallic</button>
    <button type="button" class="tchip" data-set-theme="papyrus">Papyrus</button>
  </div>
  <div class="schemebar" id="schemeBar">
    <button type="button" id="schemePrev" aria-label="Previous scheme">&#8249;</button>
    <span id="schemeName"></span>
    <button type="button" id="schemeNext" aria-label="Next scheme">&#8250;</button>
  </div>


  <nav class="bar">
    <button id="prevBtn" type="button">Prev Day</button>
    <button id="todayBtn" type="button">Today</button>
    <button id="nextBtn" type="button">Next Day</button>
    <span class="jump">
      <input id="dayJump" type="number" min="1" max="365" placeholder="Day">
      <button id="jumpBtn" type="button">Go</button>
    </span>
    <span class="jump">
      <input id="dateJump" type="date">
      <button id="dateBtn" type="button">Open Date</button>
    </span>
  </nav>

  <main class="card">
    <div class="sealrow"><div class="seal" aria-hidden="true"><svg viewBox="0 0 120 120"><circle cx="63" cy="64" r="52" fill="#5E170E" opacity=".55"/><circle cx="60" cy="60" r="52" fill="#7E241C"/><circle cx="60" cy="60" r="52" fill="none" stroke="#5E170E" stroke-width="3"/><circle cx="60" cy="60" r="41" fill="none" stroke="#F0D9B5" stroke-width="1.6" opacity=".65"/><path d="M60 33 V79 M45 49 H75" stroke="#F3E2BC" stroke-width="7" stroke-linecap="round" fill="none"/><text x="60" y="99" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="2" fill="#F3E2BC">MW</text></svg></div></div>
    <section class="block verse">
      <h2>Verse</h2>
      <p class="verse-text" id="verseText"></p>
      <p class="verse-ref" id="verseRef"></p>
    </section>
    <section class="block affirmation">
      <h2>Affirmation</h2>
      <p class="affirmation-text" id="affirmText"></p>
    </section>
    <section class="block action">
      <h2>Action</h2>
      <p class="action-text" id="actionText"></p>
    </section>
  </main>

  <footer class="actions">
    <button id="shareBtn" type="button">Share</button>
    <button id="saveBtn" type="button">Save</button>
  </footer>

  <div class="savedlink">
    <button id="savedToggle" type="button">View Saved Days</button>
  </div>
  <div id="savedView">
    <h2>Saved Days</h2>
    <div id="savedList"></div>
  </div>
</div>
<div class="share-menu" id="shareMenu">
  <div class="share-box">
    <h2>Share Day <span id="shareDayNum"></span></h2>
    <p>Share the verse, the affirmation and the action for this day.</p>
    <button id="shareTextBtn" type="button">Share as text</button>
    <button id="sharePicBtn" type="button">Share as picture</button>
    <button id="shareCancelBtn" type="button">Cancel</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DATA = /*__DATA__*/[];
const SAVE_KEY = "dailyWordFrameSaved";

/* ===== Four themes: River Blue, Rotating 24, Metallic, Papyrus with Seals ===== */
const THEME_KEY = "dailyWordFrameTheme";
const THEME_NAMES = ["river", "rot24", "metal", "papyrus"];
let themeName = "river";
try {
  const t = localStorage.getItem(THEME_KEY);
  if (t && THEME_NAMES.indexOf(t) >= 0) themeName = t;
} catch (e) {}
let schemeOverride = null;

function hx(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
}

/* Rotating 24: name, page deep, page light, card deep, card light, accent, soft, ice */
const ROT24 = [
  ["Midnight Navy", "#050D1F", "#0B213F", "#0A1B33", "#050D1F", "#4C7FB8", "#84A9D1", "#D5E7F7"],
  ["Forest", "#0A1F12", "#123D22", "#0E2E1A", "#071A0E", "#4E9A68", "#8CC29E", "#DDF0E2"],
  ["Burgundy", "#26060F", "#4A1220", "#380B18", "#1E050C", "#B0526B", "#CE93A3", "#F7E3E6"],
  ["Royal Purple", "#170A2E", "#33185C", "#241145", "#120826", "#8A68C4", "#B298D9", "#EAE3F8"],
  ["Teal Depths", "#032228", "#07434E", "#053139", "#02181C", "#3E97A8", "#7FBCC7", "#DDF2F5"],
  ["Slate", "#11161C", "#2A333E", "#1D242D", "#0E1218", "#6E8296", "#9DB0C0", "#E4EBF1"],
  ["Charcoal", "#101010", "#262626", "#1C1C1C", "#0C0C0C", "#8A8A8A", "#B4B4B4", "#ECECEC"],
  ["Crimson", "#2B0505", "#570D0D", "#400808", "#200404", "#C04A4A", "#DA8F8F", "#F9E4E4"],
  ["Olive Grove", "#1C1F08", "#3C4214", "#2B3010", "#141605", "#9AA34E", "#BFC37F", "#F0F2DC"],
  ["Plum", "#22071C", "#471335", "#330C29", "#180517", "#A8558A", "#CC8FB4", "#F6E4EF"],
  ["Evergreen", "#06231C", "#0D4536", "#093528", "#04170F", "#3FA383", "#7DC2A8", "#DCF2E9"],
  ["Sapphire", "#04122E", "#0A2A66", "#071E45", "#030B1D", "#4A76D1", "#87A6E0", "#DFE9FB"],
  ["Wine", "#28030E", "#4E0A1E", "#3A0616", "#1B020A", "#BC4668", "#D5869C", "#F8E2E8"],
  ["Hunter", "#0B2016", "#173D2A", "#10291C", "#071711", "#57916F", "#90BBA0", "#E2F0E7"],
  ["Indigo", "#0D0D2B", "#23235C", "#17173F", "#090920", "#6E6EC2", "#A2A2DA", "#E7E7F8"],
  ["Mahogany", "#22100A", "#472414", "#33190D", "#180B06", "#B07A52", "#CBA184", "#F6EAE0"],
  ["Ocean", "#03202B", "#084254", "#05303F", "#02161D", "#3E97B0", "#7FBED0", "#DDF2F7"],
  ["Aubergine", "#1D0A24", "#3C174C", "#2B1036", "#140716", "#9663B0", "#BB95CC", "#F0E6F6"],
  ["Emerald", "#052417", "#0B4A2E", "#073620", "#031A10", "#3FA66B", "#7CC496", "#DFF5E7"],
  ["Garnet", "#2E0810", "#5C1220", "#420C18", "#20060B", "#C0526B", "#D88FA0", "#F9E7EA"],
  ["Bronze Age", "#1F1508", "#42300F", "#2E2009", "#150E04", "#B08D4A", "#CBAE7C", "#F4EDDC"],
  ["Midnight Teal", "#052226", "#0D454B", "#083338", "#041619", "#4FA3AD", "#89C4CB", "#E0F2F4"],
  ["Violet Dusk", "#1B1035", "#38236B", "#291A4D", "#120B24", "#8668CC", "#AF9ADE", "#EBE6FA"],
  ["Rosewood", "#2A1216", "#54252C", "#3C1A20", "#1D0C0F", "#B56B74", "#D09CA2", "#F8E9EA"]
];

/* Metallic: name, five sheen stops, page pair, ink, soft */

function schemeCount(){ return themeName === "metal" ? METALS.length : ROT24.length; }
function schemeIndex(){
  const total = schemeCount();
  if (schemeOverride && schemeOverride.theme === themeName) return schemeOverride.idx;
  return (todayDayNumber() - 1) % total;
}
function schemeName(){
  if (themeName === "metal") return METALS[schemeIndex()].name;
  if (themeName === "rot24") return ROT24[schemeIndex()][0];
  return "";
}

function activeCss(){
  if (themeName === "rot24") return rotCss(ROT24[schemeIndex()]);
  if (themeName === "metal") return metalCss(METALS[schemeIndex()]);
  if (themeName === "papyrus") return PAPYRUS_CSS;
  return RIVER_CSS;
}

function metalGradient(stops){
  const pos = [0, 22, 40, 58, 78, 100];
  const parts = [];
  for (let i = 0; i < stops.length; i++) parts.push(stops[i] + " " + pos[i] + "%");
  parts.push(stops[1] + " 100%");
  return "linear-gradient(115deg, " + parts.join(", ") + ")";
}

function applyTheme(){
  const css = activeCss();
  const root = document.documentElement;
  Object.keys(css).forEach(function(k){ root.style.setProperty(k, css[k]); });
  document.body.setAttribute("data-theme", themeName);
  const card = document.querySelector(".card");
  if (card){
    if (themeName === "metal") card.style.backgroundImage = metalGradient(METALS[schemeIndex()].stops);
    else card.style.backgroundImage = "";
  }
  const chips = document.querySelectorAll(".tchip");
  for (let i = 0; i < chips.length; i++)
    chips[i].classList.toggle("on", chips[i].getAttribute("data-set-theme") === themeName);
  const bar = document.getElementById("schemeBar");
  if (bar){
    if (themeName === "rot24" || themeName === "metal"){
      bar.style.display = "flex";
      document.getElementById("schemeName").textContent =
        schemeName() + " \u00b7 " + (schemeIndex() + 1) + " of " + schemeCount();
    } else {
      bar.style.display = "none";
    }
  }
}

function setTheme(name){
  if (THEME_NAMES.indexOf(name) < 0) return;
  themeName = name;
  schemeOverride = null;
  try { localStorage.setItem(THEME_KEY, name); } catch (e) {}
  applyTheme();
}
function stepScheme(dir){
  const total = schemeCount();
  const idx = (schemeIndex() + dir + total) % total;
  schemeOverride = { theme: themeName, idx: idx };
  applyTheme();
}
(function wireThemeControls(){
  const chips = document.querySelectorAll(".tchip");
  for (let i = 0; i < chips.length; i++){
    (function(ch){
      ch.addEventListener("click", function(){ setTheme(ch.getAttribute("data-set-theme")); });
    })(chips[i]);
  }
  const prev = document.getElementById("schemePrev");
  const next = document.getElementById("schemeNext");
  if (prev) prev.addEventListener("click", function(){ stepScheme(-1); });
  if (next) next.addEventListener("click", function(){ stepScheme(1); });
})();

function drawSealMark(ctx, cx, cy, r){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.14);
  ctx.beginPath(); ctx.arc(3, 4, r, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(94,23,14,.55)"; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = "#7E241C"; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = "#5E170E"; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, Math.PI * 2);
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(243,226,188,.65)"; ctx.stroke();
  ctx.strokeStyle = "#F3E2BC"; ctx.lineWidth = Math.max(4, r * 0.11); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, -r * 0.52); ctx.lineTo(0, r * 0.28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r * 0.30, -r * 0.26); ctx.lineTo(r * 0.30, -r * 0.26); ctx.stroke();
  ctx.fillStyle = "#F3E2BC";
  ctx.font = "bold " + Math.round(r * 0.30) + "px Georgia, 'Times New Roman', serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("MW", 0, r * 0.56);
  ctx.restore();
  ctx.textAlign = "left"; ctx.textBaseline = "top";
}

let currentDay = todayDayNumber();

function todayDayNumber(){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const n = Math.floor((now - start) / 86400000);
  return Math.min(365, Math.max(1, n));
}
function dateLabelForDay(day){
  const names = ["January","February","March","April","May","June","July",
    "August","September","October","November","December"];
  const d = new Date(new Date().getFullYear(), 0, day);
  return names[d.getMonth()] + " " + d.getDate();
}
function getSaved(){
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || []; }
  catch(e){ return []; }
}
function setSaved(list){ localStorage.setItem(SAVE_KEY, JSON.stringify(list)); }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}
function render(day){
  currentDay = Math.min(365, Math.max(1, day));
  applyTheme();
  const e = DATA[currentDay - 1];
  if(!e) return;
  document.getElementById("dateline").textContent =
    dateLabelForDay(currentDay) + " · Day " + currentDay + " of 365";
  document.getElementById("themeLine").textContent = e.theme;
  document.getElementById("verseText").textContent = e.verse;
  document.getElementById("verseRef").textContent = e.ref + " (KJV)";
  document.getElementById("affirmText").textContent = e.affirmation;
  document.getElementById("actionText").textContent = e.action;
  const saved = getSaved();
  const btn = document.getElementById("saveBtn");
  if(saved.includes(currentDay)){
    btn.textContent = "Saved";
    btn.classList.add("saved");
  } else {
    btn.textContent = "Save";
    btn.classList.remove("saved");
  }
  renderSaved();
  window.scrollTo({top:0, behavior:"smooth"});
}
function renderSaved(){
  const list = document.getElementById("savedList");
  const saved = getSaved().slice().sort((a,b)=>a-b);
  list.innerHTML = "";
  if(saved.length === 0){
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No saved days yet. Tap Save on any day and it will wait for you here.";
    list.appendChild(p);
    return;
  }
  saved.forEach(function(d){
    const e = DATA[d - 1];
    const row = document.createElement("div");
    row.className = "saved-item";
    const open = document.createElement("button");
    open.className = "open";
    open.type = "button";
    open.textContent = "Day " + d + ": " + (e ? e.ref : "");
    open.addEventListener("click", function(){ render(d); });
    const un = document.createElement("button");
    un.className = "unsave";
    un.type = "button";
    un.textContent = "Unsave";
    un.addEventListener("click", function(){
      setSaved(getSaved().filter(function(x){ return x !== d; }));
      render(currentDay);
      toast("Day " + d + " removed from saved days.");
    });
    row.appendChild(open);
    row.appendChild(un);
    list.appendChild(row);
  });
}
document.getElementById("prevBtn").addEventListener("click", function(){
  render(currentDay === 1 ? 365 : currentDay - 1);
});
document.getElementById("nextBtn").addEventListener("click", function(){
  render(currentDay === 365 ? 1 : currentDay + 1);
});
document.getElementById("todayBtn").addEventListener("click", function(){
  render(todayDayNumber());
});
document.getElementById("jumpBtn").addEventListener("click", function(){
  const v = parseInt(document.getElementById("dayJump").value, 10);
  if(v >= 1 && v <= 365) render(v);
  else toast("Type a day number from 1 to 365.");
});
document.getElementById("dateBtn").addEventListener("click", function(){
  const v = document.getElementById("dateJump").value;
  if(!v){ toast("Pick a date first."); return; }
  const parts = v.split("-");
  const d = new Date(parseInt(parts[0],10), parseInt(parts[1],10) - 1, parseInt(parts[2],10));
  const start = new Date(d.getFullYear(), 0, 0);
  const n = Math.floor((d - start) / 86400000);
  render(Math.min(365, Math.max(1, n)));
});
document.getElementById("saveBtn").addEventListener("click", function(){
  let saved = getSaved();
  if(saved.includes(currentDay)){
    saved = saved.filter(function(x){ return x !== currentDay; });
    setSaved(saved);
    toast("Day " + currentDay + " removed from saved days.");
  } else {
    saved.push(currentDay);
    setSaved(saved);
    toast("Day " + currentDay + " saved.");
  }
  render(currentDay);
});
function shareTextForDay(){
  const e = DATA[currentDay - 1];
  return "My Words \u00b7 Day " + currentDay + "\n\n" +
    "VERSE\n" + e.verse + "\n" + e.ref + " (KJV)\n\n" +
    "AFFIRMATION\n" + e.affirmation + "\n\n" +
    "ACTION\n" + e.action;
}
function openShareMenu(){
  document.getElementById("shareDayNum").textContent = currentDay;
  document.getElementById("shareMenu").classList.add("open");
}
function closeShareMenu(){
  document.getElementById("shareMenu").classList.remove("open");
}
document.getElementById("shareBtn").addEventListener("click", openShareMenu);
document.getElementById("shareCancelBtn").addEventListener("click", closeShareMenu);
document.getElementById("shareMenu").addEventListener("click", function(ev){
  if(ev.target === this) closeShareMenu();
});
document.getElementById("shareTextBtn").addEventListener("click", function(){
  closeShareMenu();
  const text = shareTextForDay();
  if(navigator.share){
    navigator.share({ title: "My Words", text: text }).catch(function(){});
  } else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast("Copied. Paste it anywhere to share.");
    }, function(){ toast("Copy failed on this device."); });
  } else {
    toast("Sharing is not available on this device.");
  }
});
function wrapLines(ctx, text, maxWidth){
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = "";
  words.forEach(function(w){
    const test = line ? line + " " + w : w;
    if(!line || ctx.measureText(test).width <= maxWidth){ line = test; }
    else { lines.push(line); line = w; }
  });
  if(line) lines.push(line);
  return lines;
}
function buildCardCanvas(e){
  const pal = cardPal();
  const W = 1080;
  const marginX = 92, topPad = pal.seal ? 330 : 104, bottomPad = 140;
  const maxW = W - marginX * 2;
  const measure = document.createElement("canvas").getContext("2d");
  let scale = 1, layout = null, H = 1920;
  for(let i = 0; i < 60; i++){
    const vs = Math.round(56 * scale), bs = Math.round(42 * scale);
    const labelH = 32 * scale + 22, refH = 42 * scale + 20, gap = 54 * scale;
    const divH = Math.round(42 * scale);
    measure.font = vs + "px Georgia, 'Times New Roman', serif";
    const verseLines = wrapLines(measure, e.verse, maxW);
    measure.font = bs + "px Georgia, 'Times New Roman', serif";
    const affLines = wrapLines(measure, e.affirmation, maxW);
    const actLines = wrapLines(measure, e.action, maxW);
    const contentH = labelH + verseLines.length * vs * 1.42 + divH + refH + gap +
      labelH + affLines.length * bs * 1.5 + gap +
      labelH + actLines.length * bs * 1.5;
    layout = { scale: scale, vs: vs, bs: bs, labelH: labelH, refH: refH, gap: gap, divH: divH,
      verseLines: verseLines, affLines: affLines, actLines: actLines };
    if(topPad + contentH + bottomPad <= 1920){ H = 1920; break; }
    if(scale <= 0.5){ H = Math.ceil(topPad + contentH + bottomPad); break; }
    scale = Math.round((scale - 0.025) * 1000) / 1000;
  }
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  if(pal.stops){
    const mg = ctx.createLinearGradient(0, 0, W, H);
    const pos = [0, .22, .40, .58, .78, 1];
    for(let i = 0; i < pal.stops.length; i++) mg.addColorStop(pos[i], pal.stops[i]);
    mg.addColorStop(1, pal.stops[1]);
    ctx.fillStyle = mg;
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, pal.bgA);
    grad.addColorStop(1, pal.bgB);
    ctx.fillStyle = grad;
  }
  ctx.fillRect(0, 0, W, H);
  if(pal.fiber){
    ctx.fillStyle = "rgba(122,90,40,.045)";
    for(let fy = 60; fy < H; fy += 7) ctx.fillRect(0, fy, W, 1);
    ctx.fillStyle = "rgba(122,90,40,.035)";
    for(let fx = 48; fx < W; fx += 9) ctx.fillRect(fx, 0, 1, H);
  }
  if(pal.glow){
    const glow = ctx.createRadialGradient(W / 2, H * 0.30, 60, W / 2, H * 0.30, W * 0.9);
    pal.glow.forEach(function(g){ glow.addColorStop(g[0], g[1]); });
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.strokeStyle = pal.border;
  ctx.lineWidth = 3;
  ctx.strokeRect(34, 34, W - 68, H - 68);
  ctx.strokeStyle = pal.hairline;
  ctx.lineWidth = 1;
  ctx.strokeRect(50, 50, W - 100, H - 100);
  if(pal.seal) drawSealMark(ctx, W / 2, 196, 84);
  ctx.textBaseline = "top";
  ctx.textAlign = "left";
  let y = topPad;
  const s = layout.scale;
  function drawLabel(txt){
    ctx.font = "bold " + Math.round(32 * s) + "px Georgia, 'Times New Roman', serif";
    ctx.fillStyle = pal.label;
    ctx.fillText(txt, marginX, y);
    const tw = ctx.measureText(txt).width;
    const ly = y + Math.round(17 * s);
    const lg = ctx.createLinearGradient(marginX + tw + 26, 0, W - marginX, 0);
    lg.addColorStop(0, pal.rule);
    lg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.strokeStyle = lg;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(marginX + tw + 26, ly);
    ctx.lineTo(W - marginX, ly);
    ctx.stroke();
    y += layout.labelH;
  }
  function drawLines(arr, size, lh, color){
    ctx.font = size + "px Georgia, 'Times New Roman', serif";
    ctx.fillStyle = color;
    arr.forEach(function(ln){ ctx.fillText(ln, marginX, y); y += size * lh; });
  }
  function drawDivider(){
    const len = Math.round(210 * s), cy = y + Math.round(13 * s);
    const dg = ctx.createLinearGradient(marginX, 0, marginX + len, 0);
    dg.addColorStop(0, pal.divA);
    dg.addColorStop(1, pal.divB);
    ctx.strokeStyle = dg;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(marginX, cy);
    ctx.lineTo(marginX + len, cy);
    ctx.stroke();
    ctx.save();
    ctx.translate(marginX + len / 2, cy);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = pal.diamond;
    const d = Math.round(10 * s);
    ctx.fillRect(-d / 2, -d / 2, d, d);
    ctx.restore();
    y += layout.divH;
  }
  drawLabel("THE VERSE");
  drawLines(layout.verseLines, layout.vs, 1.42, pal.verse);
  drawDivider();
  ctx.font = "italic " + Math.round(38 * s) + "px Georgia, 'Times New Roman', serif";
  ctx.fillStyle = pal.ref;
  ctx.fillText(e.ref + " (KJV)", marginX, y + 6);
  y += layout.refH + layout.gap;
  drawLabel("THE AFFIRMATION");
  drawLines(layout.affLines, layout.bs, 1.5, pal.body);
  y += layout.gap;
  drawLabel("THE ACTION");
  drawLines(layout.actLines, layout.bs, 1.5, pal.body);
  ctx.save();
  ctx.translate(W / 2, H - 130);
  ctx.rotate(Math.PI / 4);
  ctx.fillStyle = pal.footDiamond;
  ctx.fillRect(-5, -5, 10, 10);
  ctx.restore();
  ctx.font = Math.round(36 * s) + "px Georgia, 'Times New Roman', serif";
  try { ctx.letterSpacing = Math.round(6 * s) + "px"; } catch(err){}
  ctx.fillStyle = pal.foot;
  ctx.textAlign = "center";
  ctx.fillText("My Words", W / 2, H - 96);
  try { ctx.letterSpacing = "0px"; } catch(err){}
  ctx.textAlign = "left";
  return canvas;
}

function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toast("Picture saved. Share it from your downloads.");
}
document.getElementById("sharePicBtn").addEventListener("click", function(){
  closeShareMenu();
  const e = DATA[currentDay - 1];
  let canvas;
  try { canvas = buildCardCanvas(e); }
  catch(err){ toast("Picture could not be made on this device."); return; }
  const fileName = "mywords-day-" + currentDay + ".png";
  canvas.toBlob(function(blob){
    if(!blob){ toast("Picture could not be made on this device."); return; }
    let usedShare = false;
    if(navigator.canShare && window.File && navigator.share){
      try {
        const file = new File([blob], fileName, { type: "image/png" });
        if(navigator.canShare({ files: [file] })){
          usedShare = true;
          navigator.share({ files: [file], title: "My Words" }).catch(function(err){
            if(!err || err.name !== "AbortError") downloadBlob(blob, fileName);
          });
        }
      } catch(err){ usedShare = false; }
    }
    if(!usedShare) downloadBlob(blob, fileName);
  }, "image/png");
});
document.getElementById("savedToggle").addEventListener("click", function(){
  const v = document.getElementById("savedView");
  const openNow = v.style.display === "block";
  v.style.display = openNow ? "none" : "block";
  this.textContent = openNow ? "View Saved Days" : "Hide Saved Days";
  if(!openNow) renderSaved();
});
render(currentDay);
</script>
