<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Words</title>
<style>
  :root{
    --ink:#021024; --deep:#052659; --mid:#5483B3; --soft:#7DA0CA; --ice:#C1E8FF;
    --bg-a:#021024; --bg-b:#021024;
    --glow-a:rgba(84,131,179,.42); --glow-b:rgba(5,38,89,.95);
    --card-a:#052659; --card-b:#021024; --card-border:rgba(84,131,179,.55);
    --halo:rgba(84,131,179,.22); --shadow:rgba(0,0,0,.55); --shadow2:rgba(0,0,0,.35);
    --hl:rgba(193,232,255,.14);
    --hair:rgba(84,131,179,.30); --ghost:rgba(193,232,255,.05); --action-bg:#052659;
    --field-bg:rgba(2,16,36,.55); --overlay:rgba(2,16,36,.78);
    --btn-a:#5483B3; --btn-b:#052659; --btn-ink:#FFFFFF; --btn-border:rgba(193,232,255,.40);
    --btn2-a:#052659; --btn2-b:#021024; --btn2-ink:#C1E8FF; --btn2-border:rgba(125,160,202,.55);
    --saved-a:#7DA0CA; --saved-b:#5483B3; --saved-ink:#021024;
    --nav-bg-a:rgba(84,131,179,.30); --nav-bg-b:rgba(5,38,89,.70); --nav-ink:#C1E8FF;
    --nav-border:rgba(125,160,202,.45); --nav-hover-a:rgba(125,160,202,.45); --nav-hover-b:rgba(5,38,89,.75);
    --head-ink:#C1E8FF; --title-ink:#FFFFFF; --title-glow:rgba(125,160,202,.5); --head-rule:rgba(125,160,202,.9);
    --label:#7DA0CA; --page-label:#7DA0CA; --label-rule:rgba(84,131,179,.75); --ref-ink:#7DA0CA;
    --on-card:#FFFFFF; --aff-ink:#C1E8FF; --act-ink:#C1E8FF;
    --tex:none; --tex-card:none;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:
      var(--tex),
      radial-gradient(ellipse 95% 52% at 50% -10%, var(--glow-a), rgba(0,0,0,0) 62%),
      radial-gradient(ellipse 85% 42% at 50% 112%, var(--glow-b), rgba(0,0,0,0) 70%),
      linear-gradient(180deg, var(--bg-a), var(--bg-b));
    background-attachment:fixed;
    color:var(--head-ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 40px;
  }
  .frame{width:100%;max-width:580px;}
  header{
    text-align:center;
    color:var(--head-ink);
    padding:26px 8px 6px;
  }
  header::after{
    content:"";
    display:block;
    width:180px;
    height:1px;
    margin:18px auto 0;
    background:linear-gradient(90deg, rgba(0,0,0,0), var(--head-rule), rgba(0,0,0,0));
  }
  header h1{
    font-size:2.2rem;
    letter-spacing:.16em;
    color:var(--title-ink);
    font-weight:normal;
    text-shadow:0 2px 22px var(--title-glow);
  }
  header .dateline{
    margin-top:10px;
    font-size:1rem;
    letter-spacing:.03em;
    color:var(--head-ink);
  }
  header .theme{
    margin-top:7px;
    font-size:.78rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--page-label);
  }
  .themebar{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    justify-content:center;
    margin:16px 0 0;
  }
  .tchip{
    font-family:inherit;
    font-size:.82rem;
    letter-spacing:.06em;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    background:linear-gradient(180deg, var(--nav-bg-a), var(--nav-bg-b));
    color:var(--nav-ink);
    border:1px solid var(--nav-border);
    box-shadow:0 3px 10px var(--shadow2), inset 0 1px 0 var(--hl);
    transition:background .2s, transform .12s;
  }
  .tchip:active{transform:translateY(1px);}
  .tchip.on{
    background:linear-gradient(180deg, var(--btn-a), var(--btn-b));
    color:var(--btn-ink);
    border-color:var(--btn-border);
    font-weight:bold;
  }
  nav.bar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    align-items:center;
    margin:16px 0 18px;
  }
  nav.bar button, .jump button{
    font-family:inherit;
    background:linear-gradient(180deg, var(--nav-bg-a), var(--nav-bg-b));
    color:var(--nav-ink);
    border:1px solid var(--nav-border);
    border-radius:10px;
    padding:9px 15px;
    font-size:.9rem;
    cursor:pointer;
    box-shadow:0 4px 14px var(--shadow2), inset 0 1px 0 var(--hl);
    transition:background .2s, transform .12s, box-shadow .12s;
  }
  nav.bar button:hover, .jump button:hover{
    background:linear-gradient(180deg, var(--nav-hover-a), var(--nav-hover-b));
    transform:translateY(-1px);
  }
  nav.bar button:active, .jump button:active{
    transform:translateY(1px);
    box-shadow:0 2px 8px var(--shadow2), inset 0 2px 6px rgba(0,0,0,.3);
  }
  .jump{display:flex;gap:6px;align-items:center;}
  .jump input{
    font-family:inherit;
    width:74px;
    padding:9px;
    border-radius:10px;
    border:1px solid var(--nav-border);
    background:var(--field-bg);
    color:var(--nav-ink);
    color-scheme:dark;
    font-size:.9rem;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.3);
  }
  body[data-theme="papyrus"] .jump input{color-scheme:light;}
  .jump input::placeholder{color:var(--page-label);}
  .jump input[type="date"]{width:150px;}
  button:focus-visible, input:focus-visible{outline:2px solid var(--label);outline-offset:2px;}
  .card{
    position:relative;
    background:
      var(--tex-card),
      linear-gradient(168deg, var(--card-a), var(--card-b));
    border:1px solid var(--card-border);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 26px 60px var(--shadow), 0 0 90px var(--halo), inset 0 1px 0 var(--hl);
  }
  body[data-theme="metal"] .card{
    background-size:230% 100%;
    animation:cardSheen 11s ease-in-out infinite alternate;
  }
  @keyframes cardSheen{
    from{background-position:0% 0;}
    to{background-position:100% 0;}
  }
  .sealrow{
    display:none;
    justify-content:flex-end;
    padding:16px 20px 0;
  }
  body[data-theme="papyrus"] .sealrow{display:flex;}
  .seal{
    width:78px;
    height:78px;
    transform:rotate(-8deg);
    filter:drop-shadow(0 4px 6px rgba(43,30,12,.45));
  }
  .seal svg{display:block;width:100%;height:100%;}
  section.block{padding:0;}
  section.block + section.block{border-top:1px solid var(--hair);}
  .phase-body{display:none;padding:30px 32px;}
  .phase-body.open{display:block;animation:reveal .5s ease both;}
  @keyframes reveal{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .cover{
    display:flex;flex-direction:column;align-items:center;gap:11px;
    width:100%;background:transparent;border:none;cursor:pointer;
    font-family:inherit;padding:36px 26px 32px;color:var(--label);text-align:center;
    transition:opacity .25s;
  }
  .cover .cover-seal{width:52px;height:52px;color:var(--mid);opacity:.92;}
  .cover .cover-seal svg{display:block;width:100%;height:100%;}
  body[data-theme="papyrus"] .cover .cover-seal{color:#7E241C;}
  body[data-theme="papyrus"] .cover{
    background:linear-gradient(180deg, rgba(255,250,230,.38), rgba(122,90,40,.07));
  }
  .cover .cover-label{
    font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;
    color:var(--label);font-weight:bold;
  }
  .cover .cover-hint{
    font-size:.86rem;color:var(--page-label);font-style:italic;letter-spacing:.05em;
  }
  .cover:hover .cover-label{color:var(--on-card);}
  body[data-theme="papyrus"] .cover:hover .cover-label{color:#7E241C;}
  .cover.waiting{opacity:.48;}
  .cover.shake{animation:shake .32s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .scene{
    position:relative;border-radius:18px;overflow:hidden;
    border:1px solid var(--card-border);margin-top:18px;
    box-shadow:0 18px 44px var(--shadow2), inset 0 1px 0 var(--hl);
    text-align:left;
  }
  .scene svg{display:block;width:100%;height:auto;}
  .scene .greet{
    position:absolute;top:0;left:0;right:0;padding:15px 19px 30px;
    color:#FFFFFF;
    background:linear-gradient(180deg, rgba(3,10,22,.52), rgba(3,10,22,0));
  }
  .scene[data-time="morning"] .greet, .scene[data-time="afternoon"] .greet{
    color:#14303F;
    background:linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0));
  }
  .greet-line{font-size:1.42rem;letter-spacing:.03em;line-height:1.2;}
  .greet-slot{
    margin-top:4px;font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;opacity:.88;
  }
  .tabs{display:flex;gap:8px;margin:14px 0 0;}
  .tab{
    flex:1;font-family:inherit;cursor:pointer;text-align:center;
    background:linear-gradient(180deg, var(--nav-bg-a), var(--nav-bg-b));
    color:var(--nav-ink);border:1px solid var(--nav-border);border-radius:12px;
    padding:10px 4px 9px;position:relative;
    box-shadow:0 4px 14px var(--shadow2), inset 0 1px 0 var(--hl);
    transition:background .2s, transform .12s;
  }
  .tab .t{display:block;font-size:.96rem;letter-spacing:.04em;}
  .tab .s{
    display:block;margin-top:3px;font-size:.6rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--label);
  }
  .tab .nowtag{
    display:none;margin-top:5px;font-size:.58rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--label);
  }
  .tab.now .nowtag{display:block;}
  .tab.now .nowtag::before{content:"● ";font-size:.5rem;vertical-align:2px;}
  .tab.on{
    background:linear-gradient(180deg, var(--btn-a), var(--btn-b));
    color:var(--btn-ink);border-color:var(--btn-border);font-weight:bold;
  }
  .tab.on .s, .tab.on .nowtag{color:var(--btn-ink);opacity:.85;}
  .block h2{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:.74rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--label);
    margin-bottom:16px;
    font-weight:bold;
  }
  .block h2::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--label-rule), rgba(0,0,0,0));
  }
  .verse-text{
    font-size:1.48rem;
    line-height:1.62;
    color:var(--on-card);
  }
  .verse-ref{
    position:relative;
    margin-top:26px;
    padding-top:22px;
    font-size:.84rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ref-ink);
  }
  .verse-ref::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:168px;
    height:1px;
    background:linear-gradient(90deg, var(--head-rule), rgba(0,0,0,0));
  }
  .verse-ref::after{
    content:"";
    position:absolute;
    top:-4px;
    left:80px;
    width:8px;
    height:8px;
    background:var(--mid);
    transform:rotate(45deg);
    box-shadow:0 0 10px var(--title-glow);
  }
  section.affirmation{background:var(--ghost);}
  .affirmation-text{
    font-size:1.1rem;
    line-height:1.75;
    color:var(--aff-ink);
  }
  .action-text{
    background:var(--action-bg);
    border-left:3px solid var(--mid);
    border-radius:10px;
    padding:18px 20px;
    font-size:1.08rem;
    line-height:1.65;
    color:var(--act-ink);
    box-shadow:inset 0 1px 0 var(--hl), 0 10px 24px var(--shadow2);
  }
  @media (max-width:480px){
    .phase-body{padding:25px 22px;}
    .cover{padding:32px 20px 28px;}
    header h1{font-size:1.9rem;}
    .verse-text{font-size:1.36rem;}
    .tab .t{font-size:.86rem;}
    .greet-line{font-size:1.24rem;}
  }
  footer.actions{
    display:flex;
    gap:12px;
    margin-top:18px;
  }
  footer.actions button{
    flex:1;
    font-family:inherit;
    font-size:1.02rem;
    letter-spacing:.05em;
    padding:15px;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 10px 24px var(--shadow2), inset 0 1px 0 var(--hl);
    transition:transform .12s, box-shadow .12s, background .2s;
  }
  footer.actions button:active{
    transform:translateY(1px);
    box-shadow:0 4px 12px var(--shadow2), inset 0 2px 6px rgba(0,0,0,.3);
  }
  #shareBtn{background:linear-gradient(180deg, var(--btn-a), var(--btn-b));color:var(--btn-ink);border:1px solid var(--btn-border);}
  #shareBtn:hover{filter:brightness(1.08);}
  #saveBtn{background:linear-gradient(180deg, var(--btn2-a), var(--btn2-b));color:var(--btn2-ink);border:1px solid var(--btn2-border);}
  #saveBtn:hover{filter:brightness(1.06);}
  #saveBtn.saved{
    background:linear-gradient(180deg, var(--saved-a), var(--saved-b));
    color:var(--saved-ink);
    border:1px solid var(--btn-border);
    font-weight:bold;
  }
  .savedlink{
    margin-top:16px;
    text-align:center;
  }
  .savedlink button{
    background:none;border:none;color:var(--label);
    font-family:inherit;font-size:.92rem;cursor:pointer;
    text-decoration:underline;
  }
  .savedlink button:hover{color:var(--head-ink);}
  #savedView{
    display:none;margin-top:16px;
    background:
      var(--tex-card),
      linear-gradient(168deg, var(--card-a), var(--card-b));
    border:1px solid var(--card-border);
    border-radius:18px;padding:22px 24px;
    box-shadow:0 20px 44px var(--shadow2), inset 0 1px 0 var(--hl);
  }
  #savedView h2{font-size:1rem;color:var(--on-card);letter-spacing:.08em;margin-bottom:10px;font-weight:normal;}
  #savedView .empty{color:var(--label);font-size:.95rem;line-height:1.5;}
  .saved-item{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:11px 4px;border-top:1px solid var(--hair);
  }
  .saved-item .open{
    background:none;border:none;font-family:inherit;text-align:left;cursor:pointer;
    color:var(--aff-ink);font-size:.98rem;flex:1;
  }
  .saved-item .open:hover{color:var(--on-card);}
  .saved-item .unsave{
    background:var(--field-bg);border:1px solid var(--nav-border);border-radius:8px;
    font-family:inherit;font-size:.8rem;padding:6px 10px;cursor:pointer;color:var(--nav-ink);
  }
  .saved-item .unsave:hover{border-color:var(--label);}
  .share-menu{
    position:fixed;inset:0;background:var(--overlay);
    display:none;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .share-menu.open{display:flex;}
  .share-box{
    background:
      var(--tex-card),
      linear-gradient(165deg, var(--card-a), var(--card-b));
    border:1px solid var(--card-border);
    border-radius:18px;padding:24px;width:100%;max-width:340px;
    box-shadow:0 24px 60px var(--shadow), inset 0 1px 0 var(--hl);
  }
  .share-box h2{font-size:1.1rem;color:var(--on-card);margin-bottom:6px;font-weight:normal;letter-spacing:.05em;}
  .share-box p{font-size:.9rem;color:var(--label);margin-bottom:14px;line-height:1.5;}
  .share-box button{
    display:block;width:100%;font-family:inherit;font-size:1rem;padding:13px;
    border-radius:11px;cursor:pointer;margin-top:9px;letter-spacing:.04em;
    box-shadow:0 8px 20px var(--shadow2), inset 0 1px 0 var(--hl);
    transition:transform .12s, background .2s;
  }
  .share-box button:active{transform:translateY(1px);}
  #shareTextBtn{background:linear-gradient(180deg, var(--btn-a), var(--btn-b));color:var(--btn-ink);border:1px solid var(--btn-border);}
  #sharePicBtn{background:linear-gradient(180deg, var(--btn2-a), var(--btn2-b));color:var(--btn2-ink);border:1px solid var(--btn2-border);}
  #shareCancelBtn{background:var(--field-bg);color:var(--label);border:1px solid var(--hair);box-shadow:none;}
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:linear-gradient(180deg, var(--btn2-a), var(--btn2-b));
    border:1px solid var(--btn2-border);
    box-shadow:0 12px 30px var(--shadow2);
    color:var(--btn2-ink);padding:11px 19px;border-radius:10px;
    font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1>My Words</h1>
    <div class="dateline" id="dateline"></div>
    <div class="theme" id="themeLine"></div>
    <div class="scene" id="sceneBox" data-time="morning">
      <div id="sceneArt"></div>
      <div class="greet">
        <div class="greet-line" id="greetLine">Good morning</div>
        <div class="greet-slot" id="greetSlot">Morning · Who Christ Is</div>
      </div>
    </div>
    <div class="tabs" role="tablist" aria-label="Time of day">
      <button type="button" class="tab" id="tab-morning" data-slot="morning" role="tab" aria-selected="false"><span class="t">Morning</span><span class="s">Who Christ Is</span><span class="nowtag">Now</span></button>
      <button type="button" class="tab" id="tab-afternoon" data-slot="afternoon" role="tab" aria-selected="false"><span class="t">Afternoon</span><span class="s">General</span><span class="nowtag">Now</span></button>
      <button type="button" class="tab" id="tab-evening" data-slot="evening" role="tab" aria-selected="false"><span class="t">Evening</span><span class="s">Who I Am in Christ</span><span class="nowtag">Now</span></button>
    </div>
  </header>

  <div class="themebar" role="group" aria-label="Theme">
    <button type="button" class="tchip" data-set-theme="river">River Blue</button>
    <button type="button" class="tchip" data-set-theme="rot24">24 Colors</button>
    <button type="button" class="tchip" data-set-theme="metal">Metallic</button>
    <button type="button" class="tchip" data-set-theme="papyrus">Papyrus</button>
  </div>


  <nav class="bar">
    <button id="prevBtn" type="button">Prev Day</button>
    <button id="todayBtn" type="button">Today</button>
    <button id="nextBtn" type="button">Next Day</button>
    <span class="jump">
      <input id="dayJump" type="number" min="1" max="365" placeholder="Day">
      <button id="jumpBtn" type="button">Go</button>
    </span>
    <span class="jump">
      <input id="dateJump" type="date">
      <button id="dateBtn" type="button">Open Date</button>
    </span>
  </nav>

  <main class="card">
    <div class="sealrow"><div class="seal" aria-hidden="true"><svg viewBox="0 0 120 120"><circle cx="63" cy="64" r="52" fill="#5E170E" opacity=".55"/><circle cx="60" cy="60" r="52" fill="#7E241C"/><circle cx="60" cy="60" r="52" fill="none" stroke="#5E170E" stroke-width="3"/><circle cx="60" cy="60" r="41" fill="none" stroke="#F0D9B5" stroke-width="1.6" opacity=".65"/><path d="M60 33 V79 M45 49 H75" stroke="#F3E2BC" stroke-width="7" stroke-linecap="round" fill="none"/><text x="60" y="99" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="2" fill="#F3E2BC">MW</text></svg></div></div>
    <section class="block verse">
      <button type="button" class="cover" id="cover0" aria-expanded="false" aria-controls="phase0">
        <span class="cover-seal" aria-hidden="true"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="3" opacity=".5"/><circle cx="60" cy="60" r="41" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".7"/><path d="M60 33 V79 M45 49 H75" stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none"/><text x="60" y="99" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="2" fill="currentColor">MW</text></svg></span>
        <span class="cover-label">The Verse</span>
        <span class="cover-hint">Tap to reveal</span>
      </button>
      <div class="phase-body" id="phase0">
        <h2>The Verse</h2>
        <p class="verse-text" id="verseText"></p>
        <p class="verse-ref" id="verseRef"></p>
      </div>
    </section>
    <section class="block affirmation">
      <button type="button" class="cover" id="cover1" aria-expanded="false" aria-controls="phase1">
        <span class="cover-seal" aria-hidden="true"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="3" opacity=".5"/><circle cx="60" cy="60" r="41" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".7"/><path d="M60 33 V79 M45 49 H75" stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none"/><text x="60" y="99" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="2" fill="currentColor">MW</text></svg></span>
        <span class="cover-label">The Affirmation</span>
        <span class="cover-hint">Tap to reveal</span>
      </button>
      <div class="phase-body" id="phase1">
        <h2>The Affirmation</h2>
        <p class="affirmation-text" id="affirmText"></p>
      </div>
    </section>

function schemeCount(){ return themeName === "metal" ? METALS.length : ROT24.length; }
function schemeIndex(){
  return (todayDayNumber() - 1) % schemeCount();
}
function activeCss(){
  if (themeName === "rot24") return rotCss(ROT24[schemeIndex()]);
  if (themeName === "metal") return metalCss(METALS[schemeIndex()]);
  if (themeName === "papyrus") return PAPYRUS_CSS;
  return RIVER_CSS;
}

function metalGradient(stops){
  const pos = [0, 22, 40, 58, 78, 100];
  const parts = [];
  for (let i = 0; i < stops.length; i++) parts.push(stops[i] + " " + pos[i] + "%");
  parts.push(stops[1] + " 100%");
  return "linear-gradient(115deg, " + parts.join(", ") + ")";
}

function applyTheme(){
  const css = activeCss();
  const root = document.documentElement;
  Object.keys(css).forEach(function(k){ root.style.setProperty(k, css[k]); });
  document.body.setAttribute("data-theme", themeName);
  const card = document.querySelector(".card");
  if (card){
    if (themeName === "metal") card.style.backgroundImage = metalGradient(METALS[schemeIndex()].stops);
    else card.style.backgroundImage = "";
  }
  const chips = document.querySelectorAll(".tchip");
  for (let i = 0; i < chips.length; i++)
    chips[i].classList.toggle("on", chips[i].getAttribute("data-set-theme") === themeName);
}

function setTheme(name){
  if (THEME_NAMES.indexOf(name) < 0) return;
  themeName = name;
  try { localStorage.setItem(THEME_KEY, name); } catch (e) {}
  applyTheme();
}
(function wireThemeControls(){
  const chips = document.querySelectorAll(".tchip");
  for (let i = 0; i < chips.length; i++){
    (function(ch){
      ch.addEventListener("click", function(){ setTheme(ch.getAttribute("data-set-theme")); });
    })(chips[i]);
  }
})();

function drawSealMark(ctx, cx, cy, r){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.14);
  ctx.beginPath(); ctx.arc(3, 4, r, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(94,23,14,.55)"; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = "#7E241C"; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = "#5E170E"; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, Math.PI * 2);
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(243,226,188,.65)"; ctx.stroke();
  ctx.strokeStyle = "#F3E2BC"; ctx.lineWidth = Math.max(4, r * 0.11); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, -r * 0.52); ctx.lineTo(0, r * 0.28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r * 0.30, -r * 0.26); ctx.lineTo(r * 0.30, -r * 0.26); ctx.stroke();
  ctx.fillStyle = "#F3E2BC";
  ctx.font = "bold " + Math.round(r * 0.30) + "px Georgia, 'Times New Roman', serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("MW", 0, r * 0.56);
  ctx.restore();
  ctx.textAlign = "left"; ctx.textBaseline = "top";
}

/* ===== Three times of day: Morning (Who Christ Is), Afternoon (General),
   Evening (Who I Am in Christ). The app reads the visitor's clock and the
   season, and the header scene follows both. ===== */
const SLOTS = {
  morning: { name: "Morning", title: "Who Christ Is", greet: "Good morning" },
  afternoon: { name: "Afternoon", title: "General", greet: "Good afternoon" },
  evening: { name: "Evening", title: "Who I Am in Christ", greet: "Good evening" }
};
const SLOT_ORDER = ["morning", "afternoon", "evening"];
function slotForNow(){
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return "morning";
  if (h >= 12 && h < 17) return "afternoon";
  return "evening";
}
let currentSlot = slotForNow();
function seasonForDay(day){
  const m = new Date(new Date().getFullYear(), 0, day).getMonth();
  if (m >= 2 && m <= 4) return "spring";
  if (m >= 5 && m <= 7) return "summer";
  if (m >= 8 && m <= 10) return "autumn";
  return "winter";
}

// soft gradient skies, a large celestial disc, layered hazy ridges with
// smooth bezier crests, tiered pine silhouettes, and a winding river
// catching the light. One landscape, dressed by time and season.
function pinePath(){
  // One continuous pine silhouette in local coords: origin at trunk
  // base, about 70 wide and 124 tall, with scalloped tiered edges like
  // the pines in the example poster (no stacked separate shapes).
  return '<path d="M0 -124 ' +
    'Q7 -112 10 -100 Q6 -96 5 -93 Q13 -86 17 -79 Q11 -73 10 -70 ' +
    'Q19 -63 24 -57 Q16 -50 15 -46 Q26 -39 30 -32 Q21 -25 20 -21 ' +
    'Q30 -14 35 -5 L4 -1 L4 0 L-4 0 L-4 -1 L-35 -5 ' +
    'Q-30 -14 -20 -21 Q-21 -25 -30 -32 Q-26 -39 -15 -46 Q-16 -50 -24 -57 ' +
    'Q-19 -63 -10 -70 Q-11 -73 -17 -79 Q-13 -86 -5 -93 Q-6 -96 -10 -100 ' +
    'Q-7 -112 0 -124 Z"/>';
}
function pineTree(x, y, s, c, op){
  return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')" fill="' + c + '"' +
    (op ? ' opacity="' + op + '"' : '') + '>' + pinePath() + '</g>';
}
function bareTree(x, y, s, c){
  return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')" stroke="' + c +
    '" stroke-width="3.4" fill="none" stroke-linecap="round">' +
    '<path d="M0 0 C -1 -22, 1 -44, 0 -66"/>' +
    '<path d="M0 -26 C -10 -32, -16 -40, -21 -50"/>' +
    '<path d="M0 -38 C 9 -44, 14 -52, 18 -62"/>' +
    '<path d="M0 -52 C -7 -58, -11 -65, -13 -74"/>' +
    '<path d="M0 -66 C 5 -72, 8 -78, 9 -86"/>' +
    '<path d="M-21 -50 C -25 -53, -28 -57, -30 -62" stroke-width="2.2"/>' +
    '<path d="M18 -62 C 22 -65, 25 -69, 26 -74" stroke-width="2.2"/></g>';
}
function canopyTree(x, y, s, trunk, cols){
  return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')">' +
    '<rect x="-2.6" y="-20" width="5.2" height="20" fill="' + trunk + '"/>' +
    '<circle cx="-14" cy="-26" r="12" fill="' + cols[0] + '"/>' +
    '<circle cx="14" cy="-27" r="13" fill="' + cols[1] + '"/>' +
    '<circle cx="0" cy="-37" r="16" fill="' + cols[0] + '"/>' +
    '<circle cx="-5" cy="-30" r="9" fill="' + cols[2] + '"/>' +
    '<circle cx="9" cy="-22" r="8" fill="' + cols[1] + '"/></g>';
}
function blossomTree(x, y, s, trunk){
  return canopyTree(x, y, s, trunk, ["#E9A9C0", "#EFC0D2", "#F3CBDC"]);
}

function darken(hex, f){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);
  return "rgb(" + r + "," + g + "," + b + ")";
}
function sceneSVG(time, season){
  const P = SCENE_PAL[time][season];
  const winter = season === "winter";
  const SKY_OFF = { 4: [0, .35, .7, 1], 5: [0, .3, .55, .8, 1] };
  let stops = "";
  P.sky.forEach(function(c, i){ stops += '<stop offset="' + SKY_OFF[P.sky.length][i] + '" stop-color="' + c + '"/>'; });
  let s = '<svg viewBox="0 0 600 340" preserveAspectRatio="xMidYMid slice" role="img" aria-label="' + time + " in " + season + '">';
  s += '<defs>' +
    '<linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">' + stops + '</linearGradient>' +
    '<radialGradient id="haloG"><stop offset="0" stop-color="rgba(255,226,160,.85)"/><stop offset=".55" stop-color="rgba(255,205,120,.32)"/><stop offset="1" stop-color="rgba(255,205,120,0)"/></radialGradient>' +
    '<radialGradient id="sunG"><stop offset="0" stop-color="#FFF6CE"/><stop offset=".7" stop-color="#FFEDAC"/><stop offset="1" stop-color="#FFE49A"/></radialGradient>' +
    '<radialGradient id="moonGlowG"><stop offset="0" stop-color="rgba(190,220,255,.5)"/><stop offset=".6" stop-color="rgba(170,205,250,.18)"/><stop offset="1" stop-color="rgba(170,205,250,0)"/></radialGradient>' +
    '<radialGradient id="dayHaloG"><stop offset="0" stop-color="rgba(255,246,200,.8)"/><stop offset=".6" stop-color="rgba(255,240,180,.3)"/><stop offset="1" stop-color="rgba(255,240,180,0)"/></radialGradient>' +
    '<linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + P.water[0] + '"/><stop offset=".45" stop-color="' + P.water[1] + '"/><stop offset="1" stop-color="' + P.water[2] + '"/></linearGradient>' +
    '<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>' +
    '<filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2"/></filter>' +
    '</defs>';
  s += '<rect width="600" height="340" fill="url(#skyG)"/>';
  if (time === "evening"){
    s += '<g fill="#FFFFFF">';
    SCENE_STARS.forEach(function(st){ s += '<circle cx="' + st[0] + '" cy="' + st[1] + '" r="' + st[2] + '" opacity="' + st[3] + '"/>'; });
    s += '</g>';
    s += '<circle cx="452" cy="126" r="118" fill="url(#moonGlowG)"/>';
    s += '<mask id="moonM"><rect width="600" height="340" fill="white"/><circle cx="468" cy="114" r="24" fill="black"/></mask>';
    s += '<circle cx="452" cy="126" r="27" fill="#F4F7FB" mask="url(#moonM)"/>';
  }
  if (time === "morning"){
    s += '<circle cx="318" cy="222" r="185" fill="url(#haloG)"/>';
    s += '<circle cx="318" cy="222" r="94" fill="url(#sunG)"/>';
    s += '<g filter="url(#soft)" fill="#FFFFFF"><ellipse cx="452" cy="112" rx="72" ry="9" opacity=".4"/><ellipse cx="492" cy="146" rx="56" ry="7" opacity=".32"/><ellipse cx="150" cy="152" rx="62" ry="8" opacity=".28"/></g>';
    s += '<g filter="url(#soft)" fill="#FFDCA8"><ellipse cx="330" cy="98" rx="48" ry="6" opacity=".4"/><ellipse cx="318" cy="196" rx="104" ry="6" opacity=".5"/></g>';
    s += '<g stroke="#4A3F3A" stroke-width="2.1" fill="none" stroke-linecap="round" opacity=".82">' +
      '<path d="M276 178 q6 -6 12 0 q6 -6 12 0"/><path d="M318 158 q5 -5 10 0 q5 -5 10 0"/>' +
      '<path d="M352 186 q5 -5 10 0 q5 -5 10 0"/><path d="M298 196 q4 -4 8 0 q4 -4 8 0"/>' +
      '<path d="M262 158 q4 -4 9 0 q4 -4 9 0"/><path d="M366 162 q4 -4 8 0 q4 -4 8 0"/></g>';
  }
  if (time === "afternoon"){
    s += '<circle cx="478" cy="74" r="70" fill="url(#dayHaloG)"/>';
    s += '<circle cx="478" cy="74" r="27" fill="url(#sunG)"/>';
    s += '<g fill="#FFFFFF"><g opacity=".95"><ellipse cx="150" cy="106" rx="42" ry="12"/><ellipse cx="180" cy="96" rx="28" ry="10"/><ellipse cx="122" cy="98" rx="24" ry="8"/></g>' +
      '<g opacity=".9"><ellipse cx="345" cy="120" rx="32" ry="9"/><ellipse cx="368" cy="112" rx="20" ry="7"/></g>' +
      '<g opacity=".75"><ellipse cx="536" cy="128" rx="30" ry="8"/><ellipse cx="556" cy="121" rx="20" ry="7"/></g></g>';
  }
  // Far mesa layer (hazy), then the nearer far ridge.
  s += '<path d="' + RIDGE_FAR + ' L600 340 L0 340 Z" fill="' + P.far + '"/>';
  if (winter) s += '<path d="' + RIDGE_FAR + '" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="5" stroke-linejoin="round"/>';
  if (time === "evening" && season === "autumn")
    s += '<path d="' + RIDGE_FAR2 + ' L600 340 L0 340 Z" fill="#A05E2C" opacity=".26"/>';
  s += '<path d="' + RIDGE_FAR2 + ' L600 340 L0 340 Z" fill="' + P.far2 + '"/>';
  if (winter) s += '<path d="' + RIDGE_FAR2 + '" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="4" stroke-linejoin="round"/>';
  if (P.sunhill) s += '<path d="' + SUN_HILL + '" fill="' + P.sunhill + '"/>';
  // Mid ridge with a few hazy pines standing on it.
  s += '<path d="' + RIDGE_MID + ' L600 340 L0 340 Z" fill="' + P.mid + '"/>';
  if (winter) s += '<path d="' + RIDGE_MID + '" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="4" stroke-linejoin="round"/>';
  s += pineTree(128, 264, .5, darken(P.mid, .62), .9);
  s += pineTree(168, 270, .4, darken(P.mid, .62), .9);
  s += pineTree(458, 264, .46, darken(P.mid, .62), .9);
  s += pineTree(492, 270, .38, darken(P.mid, .62), .9);
  // Near hills framing the valley, then the dark foreground.
  s += '<path d="' + HILL_L + '" fill="' + P.near + '"/>';
  s += '<path d="' + HILL_R + '" fill="' + P.near + '"/>';
  s += '<path d="' + RIDGE_FORE + ' L600 340 L0 340 Z" fill="' + P.fore + '"/>';
  // The river runs from the gap in the mid ridge down through the foreground.
  s += '<path d="' + RIVER + '" fill="url(#waterG)" opacity="' + (time === "evening" ? ".8" : ".92") + '"/>';
  s += '<path d="' + RIVER_GLINT + '" fill="none" stroke="' + (time === "evening" ? "rgba(220,238,255,.55)" : "rgba(255,248,220,.6)") + '" stroke-width="6" stroke-linecap="round" filter="url(#soft2)"/>';
  // Foreground trees.
  const treeC = darken(P.fore, .8);
  if (winter){
    s += bareTree(44, 330, 1.05, treeC);
    s += pineTree(106, 330, .95, treeC);
    s += pineTree(498, 328, 1.05, treeC);
    s += bareTree(556, 332, 1.1, treeC);
  } else if (season === "spring"){
    s += pineTree(42, 326, 1.2, treeC);
    s += pineTree(100, 330, .95, treeC);
    s += (time === "evening" ? canopyTree(510, 336, .95, treeC, ["#4A2438", "#55304A", "#5E3244"]) : blossomTree(510, 336, .95, darken(P.near, .7)));
    s += pineTree(562, 328, .9, treeC);
  } else if (season === "autumn" && time !== "evening"){
    s += pineTree(42, 326, 1.2, treeC);
    s += canopyTree(112, 330, 1.0, darken(P.near, .7), ["#C97F35", "#B85C28", "#D99647"]);
    s += pineTree(498, 328, 1.1, treeC);
    s += canopyTree(556, 330, .9, darken(P.near, .7), ["#B85C28", "#C97F35", "#CE7430"]);
  } else {
    s += pineTree(42, 326, 1.25, treeC);
    s += pineTree(100, 330, .95, treeC);
    s += pineTree(498, 328, 1.15, treeC);
    s += pineTree(556, 330, .9, treeC);
  }
  s += '</svg>';
  return s;
}

let currentDay = todayDayNumber();

function todayDayNumber(){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const n = Math.floor((now - start) / 86400000);
  return Math.min(365, Math.max(1, n));
}
function dateLabelForDay(day){
  const names = ["January","February","March","April","May","June","July",
    "August","September","October","November","December"];
  const d = new Date(new Date().getFullYear(), 0, day);
  return names[d.getMonth()] + " " + d.getDate();
}
function getSaved(){
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY)) || [];
    if (!Array.isArray(raw)) return [];
    return raw.map(function(x){
      if (typeof x === "number") return x + ":afternoon";
      return x;
    }).filter(function(x){ return /^\d+:(morning|afternoon|evening)$/.test(x); });
  } catch(e){ return []; }
}
function setSaved(list){ localStorage.setItem(SAVE_KEY, JSON.stringify(list)); }
function saveKey(){ return currentDay + ":" + currentSlot; }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}
function render(day){
  currentDay = Math.min(365, Math.max(1, day));
  applyTheme();
  const e = DATA[currentDay - 1];
  if(!e) return;
  document.getElementById("dateline").textContent =
    dateLabelForDay(currentDay) + " · Day " + currentDay + " of 365";
  renderSlot();
  renderSaved();
  window.scrollTo({top:0, behavior:"smooth"});
}
function renderSlot(){
  const e = DATA[currentDay - 1];
  if(!e) return;
  const s = e[currentSlot];
  const S = SLOTS[currentSlot];
  document.getElementById("themeLine").textContent =
    currentSlot === "afternoon" ? e.theme : s.theme;
  document.getElementById("verseText").textContent = s.verse;
  document.getElementById("verseRef").textContent = s.ref + " (KJV)";
  document.getElementById("affirmText").textContent = s.affirmation;
  document.getElementById("actionText").textContent = s.action;
  document.getElementById("greetLine").textContent = S.greet;
  document.getElementById("greetSlot").textContent = S.name + " · " + S.title;
  const box = document.getElementById("sceneBox");
  box.setAttribute("data-time", currentSlot);
  document.getElementById("sceneArt").innerHTML = sceneSVG(currentSlot, seasonForDay(currentDay));
  const nowSlot = slotForNow();
  SLOT_ORDER.forEach(function(name){
    const tab = document.getElementById("tab-" + name);
    tab.classList.toggle("on", name === currentSlot);
    tab.classList.toggle("now", name === nowSlot);
    tab.setAttribute("aria-selected", name === currentSlot ? "true" : "false");
  });
  resetVeil();
  updateSaveBtn();
}
function updateSaveBtn(){
  const btn = document.getElementById("saveBtn");
  if(getSaved().includes(saveKey())){
    btn.textContent = "Saved";
    btn.classList.add("saved");
  } else {
    btn.textContent = "Save";
    btn.classList.remove("saved");
  }
}
/* Click to reveal: the three phases open in order, a classic uncovering. */
let revealStep = 0;
const PHASE_NAMES = ["The Verse", "The Affirmation", "The Action"];
function resetVeil(){
  revealStep = 0;
  for (let i = 0; i < 3; i++){
    const c = document.getElementById("cover" + i);
    c.style.display = "";
    c.setAttribute("aria-expanded", "false");
    c.classList.toggle("waiting", i > 0);
    document.getElementById("phase" + i).classList.remove("open");
  }
}
function revealPhase(i){
  if (i < revealStep) return;
  if (i > revealStep){
    const c = document.getElementById("cover" + i);
    c.classList.remove("shake");
    void c.offsetWidth;
    c.classList.add("shake");
    toast("The three phases open in order. Begin with " + PHASE_NAMES[revealStep] + ".");
    return;
  }
  const c = document.getElementById("cover" + i);
  c.style.display = "none";
  c.setAttribute("aria-expanded", "true");
  document.getElementById("phase" + i).classList.add("open");
  revealStep++;
  if (revealStep < 3)
    document.getElementById("cover" + revealStep).classList.remove("waiting");
}
(function wireTimeControls(){
  for (let i = 0; i < 3; i++){
    (function(idx){
      document.getElementById("cover" + idx).addEventListener("click", function(){ revealPhase(idx); });
    })(i);
  }
  SLOT_ORDER.forEach(function(name){
    document.getElementById("tab-" + name).addEventListener("click", function(){
      if (currentSlot !== name){
        currentSlot = name;
        renderSlot();
      }
    });
  });
})();
function renderSaved(){
  const list = document.getElementById("savedList");
  const order = { morning: 0, afternoon: 1, evening: 2 };
  const saved = getSaved().slice().sort(function(a, b){
    const pa = a.split(":"), pb = b.split(":");
    return (parseInt(pa[0], 10) - parseInt(pb[0], 10)) || (order[pa[1]] - order[pb[1]]);
  });
  list.innerHTML = "";
  if(saved.length === 0){
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No saved times yet. Tap Save on any morning, afternoon, or evening and it will wait for you here.";
    list.appendChild(p);
    return;
  }
  saved.forEach(function(key){
    const parts = key.split(":");
    const d = parseInt(parts[0], 10), sl = parts[1];
    const e = DATA[d - 1];
    const s = e ? e[sl] : null;
    const row = document.createElement("div");
    row.className = "saved-item";
    const open = document.createElement("button");
    open.className = "open";
    open.type = "button";
    open.textContent = "Day " + d + " · " + SLOTS[sl].name + ": " + SLOTS[sl].title +
      (s ? " · " + s.ref : "");
    open.addEventListener("click", function(){
      currentSlot = sl;
      render(d);
    });
    const un = document.createElement("button");
    un.className = "unsave";
    un.type = "button";
    un.textContent = "Unsave";
    un.addEventListener("click", function(){
      setSaved(getSaved().filter(function(x){ return x !== key; }));
      updateSaveBtn();
      renderSaved();
      toast("Day " + d + " " + SLOTS[sl].name.toLowerCase() + " removed from saved.");
    });
    row.appendChild(open);
    row.appendChild(un);
    list.appendChild(row);
  });
}
document.getElementById("prevBtn").addEventListener("click", function(){
  render(currentDay === 1 ? 365 : currentDay - 1);
});
document.getElementById("nextBtn").addEventListener("click", function(){
  render(currentDay === 365 ? 1 : currentDay + 1);
});
document.getElementById("todayBtn").addEventListener("click", function(){
  render(todayDayNumber());
});
document.getElementById("jumpBtn").addEventListener("click", function(){
  const v = parseInt(document.getElementById("dayJump").value, 10);
  if(v >= 1 && v <= 365) render(v);
  else toast("Type a day number from 1 to 365.");
});
document.getElementById("dateBtn").addEventListener("click", function(){
  const v = document.getElementById("dateJump").value;
  if(!v){ toast("Pick a date first."); return; }
  const parts = v.split("-");
  const d = new Date(parseInt(parts[0],10), parseInt(parts[1],10) - 1, parseInt(parts[2],10));
  const start = new Date(d.getFullYear(), 0, 0);
  const n = Math.floor((d - start) / 86400000);
  render(Math.min(365, Math.max(1, n)));
});
document.getElementById("saveBtn").addEventListener("click", function(){
  let saved = getSaved();
  const key = saveKey();
  if(saved.includes(key)){
    saved = saved.filter(function(x){ return x !== key; });
    setSaved(saved);
    toast("Day " + currentDay + " " + SLOTS[currentSlot].name.toLowerCase() + " removed from saved.");
  } else {
    saved.push(key);
    setSaved(saved);
    toast("Day " + currentDay + " " + SLOTS[currentSlot].name.toLowerCase() + " saved.");
  }
  updateSaveBtn();
  renderSaved();
});
function shareTextForDay(){
  const e = DATA[currentDay - 1];
  const s = e[currentSlot];
  const S = SLOTS[currentSlot];
  return "My Words \u00b7 Day " + currentDay + " \u00b7 " + S.name + ": " + S.title + "\n\n" +
    "VERSE\n" + s.verse + "\n" + s.ref + " (KJV)\n\n" +
    "AFFIRMATION\n" + s.affirmation + "\n\n" +
    "ACTION\n" + s.action;
}
function openShareMenu(){
  document.getElementById("shareDayNum").textContent = currentDay;
  document.getElementById("shareSlotLine").textContent =
    SLOTS[currentSlot].name + ": " + SLOTS[currentSlot].title;
  document.getElementById("shareMenu").classList.add("open");
}
function closeShareMenu(){
  document.getElementById("shareMenu").classList.remove("open");
}
document.getElementById("shareBtn").addEventListener("click", openShareMenu);
document.getElementById("shareCancelBtn").addEventListener("click", closeShareMenu);
document.getElementById("shareMenu").addEventListener("click", function(ev){
  if(ev.target === this) closeShareMenu();
});
document.getElementById("shareTextBtn").addEventListener("click", function(){
  closeShareMenu();
  const text = shareTextForDay();
  if(navigator.share){
    navigator.share({ title: "My Words", text: text }).catch(function(){});
  } else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast("Copied. Paste it anywhere to share.");
    }, function(){ toast("Copy failed on this device."); });
  } else {
    toast("Sharing is not available on this device.");
  }
});
function wrapLines(ctx, text, maxWidth){
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = "";
  words.forEach(function(w){
    const test = line ? line + " " + w : w;
    if(!line || ctx.measureText(test).width <= maxWidth){ line = test; }
    else { lines.push(line); line = w; }
  });
  if(line) lines.push(line);
  return lines;
}
function buildCardCanvas(e, slotLabel){
  const pal = cardPal();
  const W = 1080;
  const marginX = 92, topPad = pal.seal ? 330 : 104, bottomPad = 140;
  const slotH = 60;
  const maxW = W - marginX * 2;
  const measure = document.createElement("canvas").getContext("2d");
  let scale = 1, layout = null, H = 1920;
  for(let i = 0; i < 60; i++){
    const vs = Math.round(56 * scale), bs = Math.round(42 * scale);
    const labelH = 32 * scale + 22, refH = 42 * scale + 20, gap = 54 * scale;
    const divH = Math.round(42 * scale);
    measure.font = vs + "px Georgia, 'Times New Roman', serif";
    const verseLines = wrapLines(measure, e.verse, maxW);
    measure.font = bs + "px Georgia, 'Times New Roman', serif";
    const affLines = wrapLines(measure, e.affirmation, maxW);
    const actLines = wrapLines(measure, e.action, maxW);
    const contentH = labelH + verseLines.length * vs * 1.42 + divH + refH + gap +
      labelH + affLines.length * bs * 1.5 + gap +
      labelH + actLines.length * bs * 1.5;
    layout = { scale: scale, vs: vs, bs: bs, labelH: labelH, refH: refH, gap: gap, divH: divH,
      verseLines: verseLines, affLines: affLines, actLines: actLines };
    if(topPad + slotH + contentH + bottomPad <= 1920){ H = 1920; break; }
    if(scale <= 0.5){ H = Math.ceil(topPad + slotH + contentH + bottomPad); break; }
    scale = Math.round((scale - 0.025) * 1000) / 1000;
  }
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  if(pal.stops){
    const mg = ctx.createLinearGradient(0, 0, W, H);
    const pos = [0, .22, .40, .58, .78, 1];
    for(let i = 0; i < pal.stops.length; i++) mg.addColorStop(pos[i], pal.stops[i]);
    mg.addColorStop(1, pal.stops[1]);
    ctx.fillStyle = mg;
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, pal.bgA);
    grad.addColorStop(1, pal.bgB);
    ctx.fillStyle = grad;
  }
  ctx.fillRect(0, 0, W, H);
  if(pal.fiber){
    ctx.fillStyle = "rgba(122,90,40,.045)";
    for(let fy = 60; fy < H; fy += 7) ctx.fillRect(0, fy, W, 1);
    ctx.fillStyle = "rgba(122,90,40,.035)";
    for(let fx = 48; fx < W; fx += 9) ctx.fillRect(fx, 0, 1, H);
  }
  if(pal.glow){
    const glow = ctx.createRadialGradient(W / 2, H * 0.30, 60, W / 2, H * 0.30, W * 0.9);
    pal.glow.forEach(function(g){ glow.addColorStop(g[0], g[1]); });
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.strokeStyle = pal.border;
  ctx.lineWidth = 3;
  ctx.strokeRect(34, 34, W - 68, H - 68);
  ctx.strokeStyle = pal.hairline;
  ctx.lineWidth = 1;
  ctx.strokeRect(50, 50, W - 100, H - 100);
  if(pal.seal) drawSealMark(ctx, W / 2, 196, 84);
  ctx.textBaseline = "top";
  ctx.textAlign = "left";
  let y = topPad;
  ctx.font = "bold 30px Georgia, 'Times New Roman', serif";
  try { ctx.letterSpacing = "5px"; } catch(err){}
  ctx.fillStyle = pal.label;
  ctx.textAlign = "center";
  ctx.fillText(String(slotLabel || "").toUpperCase(), W / 2, y + 2);
  try { ctx.letterSpacing = "0px"; } catch(err){}
  ctx.textAlign = "left";
  y += slotH;
  const s = layout.scale;
  function drawLabel(txt){
    ctx.font = "bold " + Math.round(32 * s) + "px Georgia, 'Times New Roman', serif";
    ctx.fillStyle = pal.label;
    ctx.fillText(txt, marginX, y);
    const tw = ctx.measureText(txt).width;
    const ly = y + Math.round(17 * s);
    const lg = ctx.createLinearGradient(marginX + tw + 26, 0, W - marginX, 0);
    lg.addColorStop(0, pal.rule);
    lg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.strokeStyle = lg;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(marginX + tw + 26, ly);
    ctx.lineTo(W - marginX, ly);
    ctx.stroke();
    y += layout.labelH;
  }
  function drawLines(arr, size, lh, color){
    ctx.font = size + "px Georgia, 'Times New Roman', serif";
    ctx.fillStyle = color;
    arr.forEach(function(ln){ ctx.fillText(ln, marginX, y); y += size * lh; });
  }
  function drawDivider(){
    const len = Math.round(210 * s), cy = y + Math.round(13 * s);
    const dg = ctx.createLinearGradient(marginX, 0, marginX + len, 0);
    dg.addColorStop(0, pal.divA);
    dg.addColorStop(1, pal.divB);
    ctx.strokeStyle = dg;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(marginX, cy);
    ctx.lineTo(marginX + len, cy);
    ctx.stroke();
    ctx.save();
    ctx.translate(marginX + len / 2, cy);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = pal.diamond;
    const d = Math.round(10 * s);
    ctx.fillRect(-d / 2, -d / 2, d, d);
    ctx.restore();
    y += layout.divH;
  }
  drawLabel("THE VERSE");
  drawLines(layout.verseLines, layout.vs, 1.42, pal.verse);
  drawDivider();
  ctx.font = "italic " + Math.round(38 * s) + "px Georgia, 'Times New Roman', serif";
  ctx.fillStyle = pal.ref;
  ctx.fillText(e.ref + " (KJV)", marginX, y + 6);
  y += layout.refH + layout.gap;
  drawLabel("THE AFFIRMATION");
  drawLines(layout.affLines, layout.bs, 1.5, pal.body);
  y += layout.gap;
  drawLabel("THE ACTION");
  drawLines(layout.actLines, layout.bs, 1.5, pal.body);
  ctx.save();
  ctx.translate(W / 2, H - 130);
  ctx.rotate(Math.PI / 4);
  ctx.fillStyle = pal.footDiamond;
  ctx.fillRect(-5, -5, 10, 10);
  ctx.restore();
  ctx.font = Math.round(36 * s) + "px Georgia, 'Times New Roman', serif";
  try { ctx.letterSpacing = Math.round(6 * s) + "px"; } catch(err){}
  ctx.fillStyle = pal.foot;
  ctx.textAlign = "center";
  ctx.fillText("My Words", W / 2, H - 96);
  try { ctx.letterSpacing = "0px"; } catch(err){}
  ctx.textAlign = "left";
  return canvas;
}

function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toast("Picture saved. Share it from your downloads.");
}
document.getElementById("sharePicBtn").addEventListener("click", function(){
  closeShareMenu();
  const e = DATA[currentDay - 1][currentSlot];
  let canvas;
  try { canvas = buildCardCanvas(e, SLOTS[currentSlot].name + ": " + SLOTS[currentSlot].title); }
  catch(err){ toast("Picture could not be made on this device."); return; }
  const fileName = "mywords-day-" + currentDay + "-" + currentSlot + ".png";
  canvas.toBlob(function(blob){
    if(!blob){ toast("Picture could not be made on this device."); return; }
    let usedShare = false;
    if(navigator.canShare && window.File && navigator.share){
      try {
        const file = new File([blob], fileName, { type: "image/png" });
        if(navigator.canShare({ files: [file] })){
          usedShare = true;
          navigator.share({ files: [file], title: "My Words" }).catch(function(err){
            if(!err || err.name !== "AbortError") downloadBlob(blob, fileName);
          });
        }
      } catch(err){ usedShare = false; }
    }
    if(!usedShare) downloadBlob(blob, fileName);
  }, "image/png");
});
document.getElementById("savedToggle").addEventListener("click", function(){
  const v = document.getElementById("savedView");
  const openNow = v.style.display === "block";
  v.style.display = openNow ? "none" : "block";
  this.textContent = openNow ? "View Saved Days" : "Hide Saved Days";
  if(!openNow) renderSaved();
});
render(currentDay);
