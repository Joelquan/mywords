<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Words</title>
<style>
  :root{
    --ink:#021024;
    --deep:#052659;
    --mid:#5483B3;
    --soft:#7DA0CA;
    --ice:#C1E8FF;
    --paper:#F4F9FF;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:
      radial-gradient(ellipse 95% 52% at 50% -10%, rgba(84,131,179,.42), rgba(84,131,179,0) 62%),
      radial-gradient(ellipse 85% 42% at 50% 112%, rgba(5,38,89,.95), rgba(5,38,89,0) 70%),
      var(--ink);
    background-attachment:fixed;
    color:var(--ice);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 40px;
  }
  .frame{width:100%;max-width:580px;}
  header{
    text-align:center;
    color:var(--ice);
    padding:26px 8px 6px;
  }
  header::after{
    content:"";
    display:block;
    width:180px;
    height:1px;
    margin:18px auto 0;
    background:linear-gradient(90deg, rgba(84,131,179,0), rgba(125,160,202,.9), rgba(84,131,179,0));
  }
  header h1{
    font-size:2.2rem;
    letter-spacing:.16em;
    color:#FFFFFF;
    font-weight:normal;
    text-shadow:0 2px 22px rgba(125,160,202,.5);
  }
  header .dateline{
    margin-top:10px;
    font-size:1rem;
    letter-spacing:.03em;
    color:var(--ice);
  }
  header .theme{
    margin-top:7px;
    font-size:.78rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--soft);
  }
  nav.bar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    align-items:center;
    margin:16px 0 18px;
  }
  nav.bar button, .jump button{
    font-family:inherit;
    background:linear-gradient(180deg, rgba(84,131,179,.30), rgba(5,38,89,.70));
    color:var(--ice);
    border:1px solid rgba(125,160,202,.45);
    border-radius:10px;
    padding:9px 15px;
    font-size:.9rem;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(193,232,255,.18);
    transition:background .2s, transform .12s, box-shadow .12s;
  }
  nav.bar button:hover, .jump button:hover{
    background:linear-gradient(180deg, rgba(125,160,202,.45), rgba(5,38,89,.75));
    color:#fff;
    transform:translateY(-1px);
  }
  nav.bar button:active, .jump button:active{
    transform:translateY(1px);
    box-shadow:0 2px 8px rgba(0,0,0,.35), inset 0 2px 6px rgba(0,0,0,.35);
  }
  .jump{display:flex;gap:6px;align-items:center;}
  .jump input{
    font-family:inherit;
    width:74px;
    padding:9px;
    border-radius:10px;
    border:1px solid rgba(125,160,202,.45);
    background:rgba(2,16,36,.55);
    color:var(--ice);
    color-scheme:dark;
    font-size:.9rem;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.35);
  }
  .jump input::placeholder{color:var(--soft);}
  .jump input[type="date"]{width:150px;}
  button:focus-visible, input:focus-visible{outline:2px solid var(--soft);outline-offset:2px;}
  .card{
    background:linear-gradient(168deg, var(--deep) 0%, var(--ink) 88%);
    border:1px solid rgba(84,131,179,.55);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 26px 60px rgba(0,0,0,.55), 0 0 90px rgba(84,131,179,.22), inset 0 1px 0 rgba(193,232,255,.14);
  }
  section.block{padding:30px 32px;}
  section.block + section.block{border-top:1px solid rgba(84,131,179,.30);}
  .block h2{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:.74rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--soft);
    margin-bottom:16px;
    font-weight:bold;
  }
  .block h2::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, rgba(84,131,179,.75), rgba(84,131,179,0));
  }
  .verse-text{
    font-size:1.48rem;
    line-height:1.62;
    color:#FFFFFF;
  }
  .verse-ref{
    position:relative;
    margin-top:26px;
    padding-top:22px;
    font-size:.84rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--soft);
  }
  .verse-ref::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:168px;
    height:1px;
    background:linear-gradient(90deg, rgba(125,160,202,.95), rgba(84,131,179,.12));
  }
  .verse-ref::after{
    content:"";
    position:absolute;
    top:-4px;
    left:80px;
    width:8px;
    height:8px;
    background:var(--mid);
    transform:rotate(45deg);
    box-shadow:0 0 10px rgba(125,160,202,.85);
  }
  section.affirmation{background:rgba(193,232,255,.05);}
  .affirmation-text{
    font-size:1.1rem;
    line-height:1.75;
    color:var(--ice);
  }
  .action-text{
    background:var(--deep);
    border-left:3px solid var(--mid);
    border-radius:10px;
    padding:18px 20px;
    font-size:1.08rem;
    line-height:1.65;
    color:var(--ice);
    box-shadow:inset 0 1px 0 rgba(193,232,255,.10), 0 10px 24px rgba(0,0,0,.30);
  }
  @media (max-width:480px){
    section.block{padding:25px 22px;}
    header h1{font-size:1.9rem;}
    .verse-text{font-size:1.36rem;}
  }
  footer.actions{
    display:flex;
    gap:12px;
    margin-top:18px;
  }
  footer.actions button{
    flex:1;
    font-family:inherit;
    font-size:1.02rem;
    letter-spacing:.05em;
    padding:15px;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(0,0,0,.40), inset 0 1px 0 rgba(193,232,255,.25);
    transition:transform .12s, box-shadow .12s, background .2s;
  }
  footer.actions button:active{
    transform:translateY(1px);
    box-shadow:0 4px 12px rgba(0,0,0,.40), inset 0 2px 6px rgba(0,0,0,.35);
  }
  #shareBtn{background:linear-gradient(180deg, var(--mid), var(--deep));color:#fff;border:1px solid rgba(193,232,255,.40);}
  #shareBtn:hover{background:linear-gradient(180deg, var(--soft), var(--mid));}
  #saveBtn{background:linear-gradient(180deg, var(--deep), var(--ink));color:var(--ice);border:1px solid rgba(125,160,202,.55);}
  #saveBtn:hover{border-color:var(--soft);}
  #saveBtn.saved{
    background:linear-gradient(180deg, var(--soft), var(--mid));
    color:var(--ink);
    border:1px solid rgba(193,232,255,.65);
    font-weight:bold;
  }
  .savedlink{
    margin-top:16px;
    text-align:center;
  }
  .savedlink button{
    background:none;border:none;color:var(--soft);
    font-family:inherit;font-size:.92rem;cursor:pointer;
    text-decoration:underline;
  }
  .savedlink button:hover{color:var(--ice);}
  #savedView{
    display:none;margin-top:16px;
    background:linear-gradient(168deg, var(--deep) 0%, var(--ink) 88%);
    border:1px solid rgba(84,131,179,.55);
    border-radius:18px;padding:22px 24px;
    box-shadow:0 20px 44px rgba(0,0,0,.45), inset 0 1px 0 rgba(193,232,255,.12);
  }
  #savedView h2{font-size:1rem;color:#FFFFFF;letter-spacing:.08em;margin-bottom:10px;font-weight:normal;}
  #savedView .empty{color:var(--soft);font-size:.95rem;line-height:1.5;}
  .saved-item{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:11px 4px;border-top:1px solid rgba(84,131,179,.30);
  }
  .saved-item .open{
    background:none;border:none;font-family:inherit;text-align:left;cursor:pointer;
    color:var(--ice);font-size:.98rem;flex:1;
  }
  .saved-item .open:hover{color:#FFFFFF;}
  .saved-item .unsave{
    background:rgba(2,16,36,.55);border:1px solid rgba(125,160,202,.5);border-radius:8px;
    font-family:inherit;font-size:.8rem;padding:6px 10px;cursor:pointer;color:var(--ice);
  }
  .saved-item .unsave:hover{border-color:var(--soft);color:#FFFFFF;}
  .share-menu{
    position:fixed;inset:0;background:rgba(2,16,36,.78);
    display:none;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .share-menu.open{display:flex;}
  .share-box{
    background:linear-gradient(165deg, var(--deep) 0%, var(--ink) 90%);
    border:1px solid rgba(84,131,179,.6);
    border-radius:18px;padding:24px;width:100%;max-width:340px;
    box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(193,232,255,.14);
  }
  .share-box h2{font-size:1.1rem;color:#FFFFFF;margin-bottom:6px;font-weight:normal;letter-spacing:.05em;}
  .share-box p{font-size:.9rem;color:var(--soft);margin-bottom:14px;line-height:1.5;}
  .share-box button{
    display:block;width:100%;font-family:inherit;font-size:1rem;padding:13px;
    border-radius:11px;cursor:pointer;margin-top:9px;letter-spacing:.04em;
    box-shadow:0 8px 20px rgba(0,0,0,.35), inset 0 1px 0 rgba(193,232,255,.22);
    transition:transform .12s, background .2s;
  }
  .share-box button:active{transform:translateY(1px);}
  #shareTextBtn{background:linear-gradient(180deg, var(--mid), var(--deep));color:#fff;border:1px solid rgba(193,232,255,.40);}
  #sharePicBtn{background:linear-gradient(180deg, var(--deep), var(--ink));color:var(--ice);border:1px solid rgba(125,160,202,.55);}
  #shareCancelBtn{background:rgba(2,16,36,.45);color:var(--soft);border:1px solid rgba(84,131,179,.4);box-shadow:none;}
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:linear-gradient(180deg, var(--deep), var(--ink));
    border:1px solid rgba(125,160,202,.55);
    box-shadow:0 12px 30px rgba(0,0,0,.5);
    color:var(--ice);padding:11px 19px;border-radius:10px;
    font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1>My Words</h1>
    <div class="dateline" id="dateline"></div>
    <div class="theme" id="themeLine"></div>
  </header>

  <nav class="bar">
    <button id="prevBtn" type="button">Prev Day</button>
    <button id="todayBtn" type="button">Today</button>
    <button id="nextBtn" type="button">Next Day</button>
    <span class="jump">
      <input id="dayJump" type="number" min="1" max="365" placeholder="Day">
      <button id="jumpBtn" type="button">Go</button>
    </span>
    <span class="jump">
      <input id="dateJump" type="date">
      <button id="dateBtn" type="button">Open Date</button>
    </span>
  </nav>

  <main class="card">
    <section class="block verse">
      <h2>Verse</h2>
      <p class="verse-text" id="verseText"></p>
      <p class="verse-ref" id="verseRef"></p>
    </section>
    <section class="block affirmation">
      <h2>Affirmation</h2>
      <p class="affirmation-text" id="affirmText"></p>
    </section>
    <section class="block action">
      <h2>Action</h2>
      <p class="action-text" id="actionText"></p>
    </section>
  </main>

  <footer class="actions">
    <button id="shareBtn" type="button">Share</button>
    <button id="saveBtn" type="button">Save</button>
  </footer>

  <div class="savedlink">
    <button id="savedToggle" type="button">View Saved Days</button>
  </div>
  <div id="savedView">
    <h2>Saved Days</h2>
    <div id="savedList"></div>
  </div>
</div>
<div class="share-menu" id="shareMenu">
  <div class="share-box">
    <h2>Share Day <span id="shareDayNum"></span></h2>
    <p>Share the verse, the affirmation and the action for this day.</p>
    <button id="shareTextBtn" type="button">Share as text</button>
    <button id="sharePicBtn" type="button">Share as picture</button>
    <button id="shareCancelBtn" type="button">Cancel</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DATA = /*__DATA__*/[];
const SAVE_KEY = "dailyWordFrameSaved";
let currentDay = todayDayNumber();

function todayDayNumber(){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const n = Math.floor((now - start) / 86400000);
  return Math.min(365, Math.max(1, n));
}
function dateLabelForDay(day){
  const names = ["January","February","March","April","May","June","July",
    "August","September","October","November","December"];
  const d = new Date(new Date().getFullYear(), 0, day);
  return names[d.getMonth()] + " " + d.getDate();
}
function getSaved(){
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || []; }
  catch(e){ return []; }
}
function setSaved(list){ localStorage.setItem(SAVE_KEY, JSON.stringify(list)); }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}
function render(day){
  currentDay = Math.min(365, Math.max(1, day));
  const e = DATA[currentDay - 1];
  if(!e) return;
  document.getElementById("dateline").textContent =
    dateLabelForDay(currentDay) + " · Day " + currentDay + " of 365";
  document.getElementById("themeLine").textContent = e.theme;
  document.getElementById("verseText").textContent = e.verse;
  document.getElementById("verseRef").textContent = e.ref + " (KJV)";
  document.getElementById("affirmText").textContent = e.affirmation;
  document.getElementById("actionText").textContent = e.action;
  const saved = getSaved();
  const btn = document.getElementById("saveBtn");
  if(saved.includes(currentDay)){
    btn.textContent = "Saved";
    btn.classList.add("saved");
  } else {
    btn.textContent = "Save";
    btn.classList.remove("saved");
  }
  renderSaved();
  window.scrollTo({top:0, behavior:"smooth"});
}
function renderSaved(){
  const list = document.getElementById("savedList");
  const saved = getSaved().slice().sort((a,b)=>a-b);
  list.innerHTML = "";
  if(saved.length === 0){
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No saved days yet. Tap Save on any day and it will wait for you here.";
    list.appendChild(p);
    return;
  }
  saved.forEach(function(d){
    const e = DATA[d - 1];
    const row = document.createElement("div");
    row.className = "saved-item";
    const open = document.createElement("button");
    open.className = "open";
    open.type = "button";
    open.textContent = "Day " + d + ": " + (e ? e.ref : "");
    open.addEventListener("click", function(){ render(d); });
    const un = document.createElement("button");
    un.className = "unsave";
    un.type = "button";
    un.textContent = "Unsave";
    un.addEventListener("click", function(){
      setSaved(getSaved().filter(function(x){ return x !== d; }));
      render(currentDay);
      toast("Day " + d + " removed from saved days.");
    });
    row.appendChild(open);
    row.appendChild(un);
    list.appendChild(row);
  });
}
document.getElementById("prevBtn").addEventListener("click", function(){
  render(currentDay === 1 ? 365 : currentDay - 1);
});
document.getElementById("nextBtn").addEventListener("click", function(){
  render(currentDay === 365 ? 1 : currentDay + 1);
});
document.getElementById("todayBtn").addEventListener("click", function(){
  render(todayDayNumber());
});
document.getElementById("jumpBtn").addEventListener("click", function(){
  const v = parseInt(document.getElementById("dayJump").value, 10);
  if(v >= 1 && v <= 365) render(v);
  else toast("Type a day number from 1 to 365.");
});
document.getElementById("dateBtn").addEventListener("click", function(){
  const v = document.getElementById("dateJump").value;
  if(!v){ toast("Pick a date first."); return; }
  const parts = v.split("-");
  const d = new Date(parseInt(parts[0],10), parseInt(parts[1],10) - 1, parseInt(parts[2],10));
  const start = new Date(d.getFullYear(), 0, 0);
  const n = Math.floor((d - start) / 86400000);
  render(Math.min(365, Math.max(1, n)));
});
document.getElementById("saveBtn").addEventListener("click", function(){
  let saved = getSaved();
  if(saved.includes(currentDay)){
    saved = saved.filter(function(x){ return x !== currentDay; });
    setSaved(saved);
    toast("Day " + currentDay + " removed from saved days.");
  } else {
    saved.push(currentDay);
    setSaved(saved);
    toast("Day " + currentDay + " saved.");
  }
  render(currentDay);
});
function shareTextForDay(){
  const e = DATA[currentDay - 1];
  return "My Words \u00b7 Day " + currentDay + "\n\n" +
    "VERSE\n" + e.verse + "\n" + e.ref + " (KJV)\n\n" +
    "AFFIRMATION\n" + e.affirmation + "\n\n" +
    "ACTION\n" + e.action;
}
function openShareMenu(){
  document.getElementById("shareDayNum").textContent = currentDay;
  document.getElementById("shareMenu").classList.add("open");
}
function closeShareMenu(){
  document.getElementById("shareMenu").classList.remove("open");
}
document.getElementById("shareBtn").addEventListener("click", openShareMenu);
document.getElementById("shareCancelBtn").addEventListener("click", closeShareMenu);
document.getElementById("shareMenu").addEventListener("click", function(ev){
  if(ev.target === this) closeShareMenu();
});
document.getElementById("shareTextBtn").addEventListener("click", function(){
  closeShareMenu();
  const text = shareTextForDay();
  if(navigator.share){
    navigator.share({ title: "My Words", text: text }).catch(function(){});
  } else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast("Copied. Paste it anywhere to share.");
    }, function(){ toast("Copy failed on this device."); });
  } else {
    toast("Sharing is not available on this device.");
  }
});
function wrapLines(ctx, text, maxWidth){
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = "";
  words.forEach(function(w){
    const test = line ? line + " " + w : w;
    if(!line || ctx.measureText(test).width <= maxWidth){ line = test; }
    else { lines.push(line); line = w; }
  });
  if(line) lines.push(line);
  return lines;
}
function buildCardCanvas(e){
  const W = 1080;
  const marginX = 92, topPad = 104, bottomPad = 140;
  const maxW = W - marginX * 2;
  const measure = document.createElement("canvas").getContext("2d");
  let scale = 1, layout = null, H = 1920;
  for(let i = 0; i < 60; i++){
    const vs = Math.round(56 * scale), bs = Math.round(42 * scale);
    const labelH = 32 * scale + 22, refH = 42 * scale + 20, gap = 54 * scale;
    const divH = Math.round(42 * scale);
    measure.font = vs + "px Georgia, 'Times New Roman', serif";
    const verseLines = wrapLines(measure, e.verse, maxW);
    measure.font = bs + "px Georgia, 'Times New Roman', serif";
    const affLines = wrapLines(measure, e.affirmation, maxW);
    const actLines = wrapLines(measure, e.action, maxW);
    const contentH = labelH + verseLines.length * vs * 1.42 + divH + refH + gap +
      labelH + affLines.length * bs * 1.5 + gap +
      labelH + actLines.length * bs * 1.5;
    layout = { scale: scale, vs: vs, bs: bs, labelH: labelH, refH: refH, gap: gap, divH: divH,
      verseLines: verseLines, affLines: affLines, actLines: actLines };
    if(topPad + contentH + bottomPad <= 1920){ H = 1920; break; }
    if(scale <= 0.5){ H = Math.ceil(topPad + contentH + bottomPad); break; }
    scale = Math.round((scale - 0.025) * 1000) / 1000;
  }
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, "#052659");
  grad.addColorStop(1, "#021024");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W / 2, H * 0.30, 60, W / 2, H * 0.30, W * 0.9);
  glow.addColorStop(0, "rgba(84,131,179,.36)");
  glow.addColorStop(0.55, "rgba(84,131,179,.10)");
  glow.addColorStop(1, "rgba(84,131,179,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(84,131,179,.65)";
  ctx.lineWidth = 3;
  ctx.strokeRect(34, 34, W - 68, H - 68);
  ctx.strokeStyle = "rgba(193,232,255,.30)";
  ctx.lineWidth = 1;
  ctx.strokeRect(50, 50, W - 100, H - 100);
  ctx.textBaseline = "top";
  ctx.textAlign = "left";
  let y = topPad;
  const s = layout.scale;
  function drawLabel(txt){
    ctx.font = "bold " + Math.round(32 * s) + "px Georgia, 'Times New Roman', serif";
    ctx.fillStyle = "#7DA0CA";
    ctx.fillText(txt, marginX, y);
    const tw = ctx.measureText(txt).width;
    const ly = y + Math.round(17 * s);
    const lg = ctx.createLinearGradient(marginX + tw + 26, 0, W - marginX, 0);
    lg.addColorStop(0, "rgba(84,131,179,.85)");
    lg.addColorStop(1, "rgba(84,131,179,0)");
    ctx.strokeStyle = lg;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(marginX + tw + 26, ly);
    ctx.lineTo(W - marginX, ly);
    ctx.stroke();
    y += layout.labelH;
  }
  function drawLines(arr, size, lh, color){
    ctx.font = size + "px Georgia, 'Times New Roman', serif";
    ctx.fillStyle = color;
    arr.forEach(function(ln){ ctx.fillText(ln, marginX, y); y += size * lh; });
  }
  function drawDivider(){
    const len = Math.round(210 * s), cy = y + Math.round(13 * s);
    const dg = ctx.createLinearGradient(marginX, 0, marginX + len, 0);
    dg.addColorStop(0, "rgba(125,160,202,.95)");
    dg.addColorStop(1, "rgba(84,131,179,.12)");
    ctx.strokeStyle = dg;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(marginX, cy);
    ctx.lineTo(marginX + len, cy);
    ctx.stroke();
    ctx.save();
    ctx.translate(marginX + len / 2, cy);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = "#5483B3";
    const d = Math.round(10 * s);
    ctx.fillRect(-d / 2, -d / 2, d, d);
    ctx.restore();
    y += layout.divH;
  }
  drawLabel("THE VERSE");
  drawLines(layout.verseLines, layout.vs, 1.42, "#FFFFFF");
  drawDivider();
  ctx.font = "italic " + Math.round(38 * s) + "px Georgia, 'Times New Roman', serif";
  ctx.fillStyle = "#7DA0CA";
  ctx.fillText(e.ref + " (KJV)", marginX, y + 6);
  y += layout.refH + layout.gap;
  drawLabel("THE AFFIRMATION");
  drawLines(layout.affLines, layout.bs, 1.5, "#C1E8FF");
  y += layout.gap;
  drawLabel("THE ACTION");
  drawLines(layout.actLines, layout.bs, 1.5, "#C1E8FF");
  ctx.save();
  ctx.translate(W / 2, H - 130);
  ctx.rotate(Math.PI / 4);
  ctx.fillStyle = "#5483B3";
  ctx.fillRect(-5, -5, 10, 10);
  ctx.restore();
  ctx.font = Math.round(36 * s) + "px Georgia, 'Times New Roman', serif";
  try { ctx.letterSpacing = Math.round(6 * s) + "px"; } catch(err){}
  ctx.fillStyle = "#C1E8FF";
  ctx.textAlign = "center";
  ctx.fillText("My Words", W / 2, H - 96);
  try { ctx.letterSpacing = "0px"; } catch(err){}
  ctx.textAlign = "left";
  return canvas;
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toast("Picture saved. Share it from your downloads.");
}
document.getElementById("sharePicBtn").addEventListener("click", function(){
  closeShareMenu();
  const e = DATA[currentDay - 1];
  let canvas;
  try { canvas = buildCardCanvas(e); }
  catch(err){ toast("Picture could not be made on this device."); return; }
  const fileName = "mywords-day-" + currentDay + ".png";
  canvas.toBlob(function(blob){
    if(!blob){ toast("Picture could not be made on this device."); return; }
    let usedShare = false;
    if(navigator.canShare && window.File && navigator.share){
      try {
        const file = new File([blob], fileName, { type: "image/png" });
        if(navigator.canShare({ files: [file] })){
          usedShare = true;
          navigator.share({ files: [file], title: "My Words" }).catch(function(err){
            if(!err || err.name !== "AbortError") downloadBlob(blob, fileName);
          });
        }
      } catch(err){ usedShare = false; }
    }
    if(!usedShare) downloadBlob(blob, fileName);
  }, "image/png");
});
document.getElementById("savedToggle").addEventListener("click", function(){
  const v = document.getElementById("savedView");
  const openNow = v.style.display === "block";
  v.style.display = openNow ? "none" : "block";
  this.textContent = openNow ? "View Saved Days" : "Hide Saved Days";
  if(!openNow) renderSaved();
});
render(currentDay);
</script>
