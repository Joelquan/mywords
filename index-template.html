<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Words</title>
<style>
  :root{
    --ink:#021024; --deep:#052659; --mid:#5483B3; --soft:#7DA0CA; --ice:#C1E8FF;
    --bg-a:#021024; --bg-b:#021024;
    --glow-a:rgba(84,131,179,.42); --glow-b:rgba(5,38,89,.95);
    --card-a:#052659; --card-b:#021024; --card-border:rgba(84,131,179,.55);
    --halo:rgba(84,131,179,.22); --shadow:rgba(0,0,0,.55); --shadow2:rgba(0,0,0,.35);
    --hl:rgba(193,232,255,.14);
    --hair:rgba(84,131,179,.30); --ghost:rgba(193,232,255,.05); --action-bg:#052659;
    --field-bg:rgba(2,16,36,.55); --overlay:rgba(2,16,36,.78);
    --btn-a:#5483B3; --btn-b:#052659; --btn-ink:#FFFFFF; --btn-border:rgba(193,232,255,.40);
    --btn2-a:#052659; --btn2-b:#021024; --btn2-ink:#C1E8FF; --btn2-border:rgba(125,160,202,.55);
    --saved-a:#7DA0CA; --saved-b:#5483B3; --saved-ink:#021024;
    --nav-bg-a:rgba(84,131,179,.30); --nav-bg-b:rgba(5,38,89,.70); --nav-ink:#C1E8FF;
    --nav-border:rgba(125,160,202,.45); --nav-hover-a:rgba(125,160,202,.45); --nav-hover-b:rgba(5,38,89,.75);
    --head-ink:#C1E8FF; --title-ink:#FFFFFF; --title-glow:rgba(125,160,202,.5); --head-rule:rgba(125,160,202,.9);
    --label:#7DA0CA; --page-label:#7DA0CA; --label-rule:rgba(84,131,179,.75); --ref-ink:#7DA0CA;
    --on-card:#FFFFFF; --aff-ink:#C1E8FF; --act-ink:#C1E8FF;
    --tex:none; --tex-card:none;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:
      var(--tex),
      radial-gradient(ellipse 95% 52% at 50% -10%, var(--glow-a), rgba(0,0,0,0) 62%),
      radial-gradient(ellipse 85% 42% at 50% 112%, var(--glow-b), rgba(0,0,0,0) 70%),
      linear-gradient(180deg, var(--bg-a), var(--bg-b));
    background-attachment:fixed;
    color:var(--head-ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 40px;
  }
  .frame{width:100%;max-width:580px;}
  header{
    text-align:center;
    color:var(--head-ink);
    padding:0;
  }
  .brandline{
    font-size:.92rem;
    letter-spacing:.08em;
    color:var(--head-ink);
    margin:0;
    width:100vw;margin-left:calc(50% - 50vw);
    padding:9px 12px 8px;
    background:linear-gradient(180deg, var(--bg-b), var(--bg-a));
    text-align:center;
  }
  .themelinks{
    text-align:center;
    margin:10px 0 0;
    font-size:.92rem;
    letter-spacing:.04em;
    color:var(--label);
  }
  .themelinks .tlink{
    color:var(--label);
    text-decoration:none;
    cursor:pointer;
    padding:2px 1px;
  }
  .themelinks .tlink:hover{text-decoration:underline;}
  .themelinks .tlink.on{
    color:var(--head-ink);
    font-weight:bold;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .themelinks .tsep{margin:0 7px;opacity:.7;}
  nav.bar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    align-items:center;
    margin:16px 0 18px;
  }
  nav.bar button{
    font-family:inherit;
    background:linear-gradient(180deg, var(--nav-bg-a), var(--nav-bg-b));
    color:var(--nav-ink);
    border:1px solid var(--nav-border);
    border-radius:10px;
    padding:9px 15px;
    font-size:.9rem;
    cursor:pointer;
    box-shadow:0 4px 14px var(--shadow2), inset 0 1px 0 var(--hl);
    transition:background .2s, transform .12s, box-shadow .12s;
  }
  nav.bar button:hover{
    background:linear-gradient(180deg, var(--nav-hover-a), var(--nav-hover-b));
    transform:translateY(-1px);
  }
  nav.bar button:active{
    transform:translateY(1px);
    box-shadow:0 2px 8px var(--shadow2), inset 0 2px 6px rgba(0,0,0,.3);
  }
  button:focus-visible, input:focus-visible{outline:2px solid var(--label);outline-offset:2px;}
  .card{
    position:relative;
    background:
      var(--tex-card),
      linear-gradient(168deg, var(--card-a), var(--card-b));
    border:1px solid var(--card-border);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 26px 60px var(--shadow), 0 0 90px var(--halo), inset 0 1px 0 var(--hl);
  }
  body[data-theme="metal"] .card{
    background-size:230% 100%;
    animation:cardSheen 11s ease-in-out infinite alternate;
  }
  @keyframes cardSheen{
    from{background-position:0% 0;}
    to{background-position:100% 0;}
  }
  .sealrow{
    display:none;
    justify-content:flex-end;
    padding:16px 20px 0;
  }
  body[data-theme="papyrus"] .sealrow{display:flex;}
  .seal{
    width:78px;
    height:78px;
    transform:rotate(-8deg);
    filter:drop-shadow(0 4px 6px rgba(43,30,12,.45));
  }
  .seal svg{display:block;width:100%;height:100%;}
  section.block{padding:0;}
  section.block + section.block{border-top:1px solid var(--hair);}
  .phase-body{display:none;padding:30px 32px;}
  .phase-body.open{display:block;animation:reveal .5s ease both;}
  @keyframes reveal{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .cover{
    display:flex;flex-direction:column;align-items:center;gap:11px;
    width:100%;background:transparent;border:none;cursor:pointer;
    font-family:inherit;padding:36px 26px 32px;color:var(--label);text-align:center;
    transition:opacity .25s;
  }
  .cover .cover-seal{width:52px;height:52px;color:var(--mid);opacity:.92;}
  .cover .cover-seal svg{display:block;width:100%;height:100%;}
  body[data-theme="papyrus"] .cover .cover-seal{color:#7E241C;}
  body[data-theme="papyrus"] .cover{
    background:linear-gradient(180deg, rgba(255,250,230,.38), rgba(122,90,40,.07));
  }
  .cover .cover-label{
    font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;
    color:var(--label);font-weight:bold;
  }
  .cover .cover-hint{
    font-size:.86rem;color:var(--page-label);font-style:italic;letter-spacing:.05em;
  }
  .cover:hover .cover-label{color:var(--on-card);}
  body[data-theme="papyrus"] .cover:hover .cover-label{color:#7E241C;}
  .cover.waiting{opacity:.48;}
  .cover.shake{animation:shake .32s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .scene{
    position:relative;overflow:hidden;
    border:none;border-radius:0;box-shadow:none;
    margin:0;
    width:100vw;margin-left:calc(50% - 50vw);
    height:var(--scene-h,150px);
    text-align:left;
  }
  .scene svg{display:block;width:100%;height:100%;}
  .scene .greet{
    position:absolute;top:0;left:0;right:0;padding:15px 19px 30px;
    color:#FFFFFF;
    background:linear-gradient(180deg, rgba(3,10,22,.52), rgba(3,10,22,0));
  }
  .scene[data-time="morning"] .greet, .scene[data-time="afternoon"] .greet{
    color:#14303F;
    background:linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0));
  }
  .greet-line{font-size:1.42rem;letter-spacing:.03em;line-height:1.2;}
  .greet-slot{
    margin-top:4px;font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;opacity:.88;
  }
  body{padding-bottom:104px;}
  .view[hidden]{display:none;}
  .bottomnav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    max-width:580px;margin:0 auto;
    display:flex;
    background:linear-gradient(180deg, var(--nav-bg-a), var(--nav-bg-b));
    border-top:1px solid var(--nav-border);
    box-shadow:0 -8px 26px var(--shadow2);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .navitem{
    flex:1;background:none;border:none;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:7px 2px 5px;color:var(--label);
    font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
  }
  .navitem svg{width:22px;height:22px;display:block;}
  .navitem .dot{width:5px;height:5px;border-radius:999px;background:currentColor;opacity:0;}
  .navitem.on{color:var(--head-ink);font-weight:bold;}
  .navitem.on .dot{opacity:1;}
  .viewhead{
    text-align:center;color:var(--head-ink);
    font-size:1.02rem;letter-spacing:.3em;text-transform:uppercase;
    margin:20px 0 2px;font-weight:bold;
  }
  .biblebar{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
    margin:14px 0 4px;
  }
  .biblebar select, .biblebar button, .verbtn{
    font-family:inherit;font-size:.92rem;cursor:pointer;
    background:linear-gradient(180deg, var(--nav-bg-a), var(--nav-bg-b));
    color:var(--nav-ink);border:1px solid var(--nav-border);border-radius:10px;
    padding:9px 12px;
    box-shadow:0 3px 10px var(--shadow2), inset 0 1px 0 var(--hl);
  }
  .biblename{
    text-align:center;color:var(--head-ink);
    font-size:1.28rem;margin:14px 0 2px;letter-spacing:.04em;
  }
  .biblebody{
    background:
      var(--tex-card),
      linear-gradient(168deg, var(--card-a), var(--card-b));
    border:1px solid var(--card-border);border-radius:18px;
    box-shadow:0 20px 44px var(--shadow2), inset 0 1px 0 var(--hl);
    padding:22px 24px;margin-top:12px;
  }
  .biblebody p.bv{font-size:1.08rem;line-height:1.75;color:var(--aff-ink);margin:0 0 10px;}
  .biblebody .bvn{
    font-size:.72rem;color:var(--label);vertical-align:super;
    margin-right:6px;letter-spacing:.05em;
  }
  .biblebody p.bv.hl{background:var(--ghost);border-radius:8px;box-shadow:0 0 0 7px var(--ghost);}
  .biblebody .bibleloading{color:var(--label);font-size:.98rem;line-height:1.6;text-align:center;}
  .verbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:14px 0 0;}
  .verbtn.on{font-weight:bold;text-decoration:underline;text-underline-offset:3px;}
  .nkjvnote{text-align:center;color:var(--label);font-size:.74rem;line-height:1.5;margin:10px auto 0;max-width:520px;}
  .settingsbox{
    background:
      var(--tex-card),
      linear-gradient(168deg, var(--card-a), var(--card-b));
    border:1px solid var(--card-border);border-radius:18px;
    box-shadow:0 20px 44px var(--shadow2), inset 0 1px 0 var(--hl);
    padding:22px 24px;margin-top:14px;
  }
  .settingsbox .themelinks{margin-top:0;}
  .settingslabel{
    text-align:center;font-size:.74rem;letter-spacing:.32em;text-transform:uppercase;
    color:var(--label);font-weight:bold;margin:22px 0 2px;
  }
  .settingshead{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    background:none;border:none;cursor:pointer;font-family:inherit;
    text-align:center;font-size:.74rem;letter-spacing:.32em;text-transform:uppercase;
    color:var(--label);font-weight:bold;margin:20px 0 2px;padding:4px 0;
  }
  .settingsbox .settingshead:first-of-type{margin-top:0;}
  .settingshead .chev{font-size:.95rem;letter-spacing:0;transition:transform .2s;}
  .settingshead[aria-expanded="true"] .chev{transform:rotate(45deg);}
  .settingspanel{padding-top:6px;}
  .slotcaption{
    padding:16px 20px 0;text-align:center;
    font-size:.76rem;letter-spacing:.3em;text-transform:uppercase;color:var(--label);
  }
  .block h2{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:.74rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--label);
    margin-bottom:16px;
    font-weight:bold;
  }
  .block h2::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--label-rule), rgba(0,0,0,0));
  }
  .verse-text{
    font-size:1.48rem;
    line-height:1.62;
    color:var(--on-card);
  }
  .verse-ref{
    position:relative;
    margin-top:26px;
    padding-top:22px;
    font-size:.84rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ref-ink);
  }
  .verse-ref::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:168px;
    height:1px;
    background:linear-gradient(90deg, var(--head-rule), rgba(0,0,0,0));
  }
  .verse-ref::after{
    content:"";
    position:absolute;
    top:-4px;
    left:80px;
    width:8px;
    height:8px;
    background:var(--mid);
    transform:rotate(45deg);
    box-shadow:0 0 10px var(--title-glow);
  }
  section.affirmation{background:var(--ghost);}
  .affirmation-text{
    font-size:1.1rem;
    line-height:1.75;
    color:var(--aff-ink);
  }
  .action-text{
    background:var(--action-bg);
    border-left:3px solid var(--mid);
    border-radius:10px;
    padding:18px 20px;
    font-size:1.08rem;
    line-height:1.65;
    color:var(--act-ink);
    box-shadow:inset 0 1px 0 var(--hl), 0 10px 24px var(--shadow2);
  }
  @media (max-width:480px){
    .phase-body{padding:25px 22px;}
    .cover{padding:32px 20px 28px;}
    .verse-text{font-size:1.36rem;}
    .greet-line{font-size:1.24rem;}
  }
  footer.actions{
    display:flex;
    gap:12px;
    margin-top:18px;
  }
  footer.actions button{
    flex:1;
    font-family:inherit;
    font-size:1.02rem;
    letter-spacing:.05em;
    padding:15px;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 10px 24px var(--shadow2), inset 0 1px 0 var(--hl);
    transition:transform .12s, box-shadow .12s, background .2s;
  }
  footer.actions button:active{
    transform:translateY(1px);
    box-shadow:0 4px 12px var(--shadow2), inset 0 2px 6px rgba(0,0,0,.3);
  }
  #shareBtn{background:linear-gradient(180deg, var(--btn-a), var(--btn-b));color:var(--btn-ink);border:1px solid var(--btn-border);}
  #shareBtn:hover{filter:brightness(1.08);}
  #saveBtn{background:linear-gradient(180deg, var(--btn2-a), var(--btn2-b));color:var(--btn2-ink);border:1px solid var(--btn2-border);}
  #saveBtn:hover{filter:brightness(1.06);}
  #saveBtn.saved{
    background:linear-gradient(180deg, var(--saved-a), var(--saved-b));
    color:var(--saved-ink);
    border:1px solid var(--btn-border);
    font-weight:bold;
  }

  #savedView{
    display:block;margin-top:14px;
    background:
      var(--tex-card),
      linear-gradient(168deg, var(--card-a), var(--card-b));
    border:1px solid var(--card-border);
    border-radius:18px;padding:22px 24px;
    box-shadow:0 20px 44px var(--shadow2), inset 0 1px 0 var(--hl);
  }
  #savedView h2{font-size:1rem;color:var(--on-card);letter-spacing:.08em;margin-bottom:10px;font-weight:normal;}
  #savedView .empty{color:var(--label);font-size:.95rem;line-height:1.5;}
  .saved-item{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:11px 4px;border-top:1px solid var(--hair);
  }
  .saved-item .open{
    background:none;border:none;font-family:inherit;text-align:left;cursor:pointer;
    color:var(--aff-ink);font-size:.98rem;flex:1;
  }
  .saved-item .open:hover{color:var(--on-card);}
  .saved-item .unsave{
    background:var(--field-bg);border:1px solid var(--nav-border);border-radius:8px;
    font-family:inherit;font-size:.8rem;padding:6px 10px;cursor:pointer;color:var(--nav-ink);
  }
  .saved-item .unsave:hover{border-color:var(--label);}
  .share-menu{
    position:fixed;inset:0;background:var(--overlay);
    display:none;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .share-menu.open{display:flex;}
  .share-box{
    background:
      var(--tex-card),
      linear-gradient(165deg, var(--card-a), var(--card-b));
    border:1px solid var(--card-border);
    border-radius:18px;padding:24px;width:100%;max-width:340px;
    box-shadow:0 24px 60px var(--shadow), inset 0 1px 0 var(--hl);
  }
  .share-box h2{font-size:1.1rem;color:var(--on-card);margin-bottom:6px;font-weight:normal;letter-spacing:.05em;}
  .share-box p{font-size:.9rem;color:var(--label);margin-bottom:14px;line-height:1.5;}
  .share-box button{
    display:block;width:100%;font-family:inherit;font-size:1rem;padding:13px;
    border-radius:11px;cursor:pointer;margin-top:9px;letter-spacing:.04em;
    box-shadow:0 8px 20px var(--shadow2), inset 0 1px 0 var(--hl);
    transition:transform .12s, background .2s;
  }
  .share-box button:active{transform:translateY(1px);}
  #shareTextBtn{background:linear-gradient(180deg, var(--btn-a), var(--btn-b));color:var(--btn-ink);border:1px solid var(--btn-border);}
  #sharePicBtn{background:linear-gradient(180deg, var(--btn2-a), var(--btn2-b));color:var(--btn2-ink);border:1px solid var(--btn2-border);}
  #shareCancelBtn{background:var(--field-bg);color:var(--label);border:1px solid var(--hair);box-shadow:none;}
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:linear-gradient(180deg, var(--btn2-a), var(--btn2-b));
    border:1px solid var(--btn2-border);
    box-shadow:0 12px 30px var(--shadow2);
    color:var(--btn2-ink);padding:11px 19px;border-radius:10px;
    font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;
  }
  .toast.show{opacity:1;}
  /* Frame side shading by time of day (Nov 12, 2026): a thin edge of
     the frame the panels are built on shows at the sides of the day
     card, shaded for the hour. The panels themselves never change.
     The slot color is set on the card by renderSlot. */
  /* One screen Home with the header joined to the photo (Nov 12, 2026):
     Home is one fixed composition at viewport heights of 740px and
     above. The date strip and the scene are one piece at the top, the
     day card flexes in the middle, Share and Save rest above the
     bottom nav, and the page never scrolls. A fit stepper shrinks the
     scene, spacing, and type only when a long day needs the room.
     Below 740px the page flows and scrolls as it did before. */
  /* Fail safe floors (Nov 12, 2026): the lock height hangs off
     100dvh, which an in-app WebKit can resolve far smaller than the
     visible viewport. These minimums are inert whenever dvh resolves
     honestly (the lock range always yields 616px or more) and hold
     the whole composition up when it does not, so the page scrolls
     a little on a very short screen instead of blanking the card. */
  #view-home{
    --scene-h:clamp(118px, 20dvh, 168px);
    display:flex;flex-direction:column;
    height:calc(100dvh - 124px);
    min-height:600px;
  }
  #view-home[hidden]{display:none;}
  #view-home header{flex:none;}
  #view-home .card{
    flex:1 1 auto;min-height:340px;
    display:flex;flex-direction:column;
    margin-top:10px;
  }
  #view-home .slotcaption{flex:none;}
  #view-home .sealrow{flex:none;}
  #view-home section.block{
    display:flex;flex-direction:column;
    flex:1 1 auto;min-height:100px;
  }
  #view-home .cover{flex:1;justify-content:center;}
  #view-home .phase-body{overflow:hidden;flex:1;min-height:0;}
  #view-home footer.actions{flex:none;margin-top:10px;}
  #view-home footer.actions button{padding:11px;}
  #view-home[data-fit="1"]{--scene-h:118px;}
  #view-home[data-fit="1"] .phase-body{padding:18px 22px;}
  #view-home[data-fit="1"] .verse-text{font-size:1.22rem;line-height:1.5;}
  #view-home[data-fit="1"] .affirmation-text{font-size:1rem;line-height:1.6;}
  #view-home[data-fit="1"] .action-text{font-size:.98rem;line-height:1.55;}
  #view-home[data-fit="1"] .block h2{margin-bottom:10px;}
  #view-home[data-fit="1"] .verse-ref{margin-top:14px;padding-top:12px;}
  #view-home[data-fit="2"]{--scene-h:96px;}
  #view-home[data-fit="2"] .phase-body{padding:14px 20px;}
  #view-home[data-fit="2"] .verse-text{font-size:1.08rem;line-height:1.45;}
  #view-home[data-fit="2"] .affirmation-text{font-size:.92rem;line-height:1.55;}
  #view-home[data-fit="2"] .action-text{font-size:.9rem;line-height:1.5;}
  #view-home[data-fit="2"] .block h2{margin-bottom:8px;}
  #view-home[data-fit="2"] .verse-ref{margin-top:10px;padding-top:10px;}
  #view-home[data-fit="2"] .cover .cover-seal{width:40px;height:40px;}
  #view-home[data-fit="2"] .greet-line{font-size:1.08rem;}
  #view-home[data-fit="3"]{--scene-h:78px;}
  #view-home[data-fit="3"] .phase-body{padding:10px 18px;}
  #view-home[data-fit="3"] .verse-text{font-size:.98rem;line-height:1.4;}

function schemeCount(){ return themeName === "metal" ? METALS.length : ROT24.length; }
function schemeIndex(){
  return (todayDayNumber() - 1) % schemeCount();
}
function activeCss(){
  if (themeName === "rot24") return rotCss(ROT24[schemeIndex()]);
  if (themeName === "metal") return metalCss(METALS[schemeIndex()]);
  if (themeName === "papyrus") return PAPYRUS_CSS;
  return RIVER_CSS;
}

function metalGradient(stops){
  const pos = [0, 22, 40, 58, 78, 100];
  const parts = [];
  for (let i = 0; i < stops.length; i++) parts.push(stops[i] + " " + pos[i] + "%");
  parts.push(stops[1] + " 100%");
  return "linear-gradient(115deg, " + parts.join(", ") + ")";
}

function applyTheme(){
  const css = activeCss();
  const root = document.documentElement;
  Object.keys(css).forEach(function(k){ root.style.setProperty(k, css[k]); });
  document.body.setAttribute("data-theme", themeName);
  const card = document.querySelector(".card");
  if (card){
    if (themeName === "metal") card.style.backgroundImage = metalGradient(METALS[schemeIndex()].stops);
    else card.style.backgroundImage = "";
  }
  const chips = document.querySelectorAll(".tlink");
  for (let i = 0; i < chips.length; i++)
    chips[i].classList.toggle("on", chips[i].getAttribute("data-set-theme") === themeName);
}

function setTheme(name){
  if (THEME_NAMES.indexOf(name) < 0) return;
  themeName = name;
  try { localStorage.setItem(THEME_KEY, name); } catch (e) {}
  applyTheme();
}
(function wireThemeControls(){
  const chips = document.querySelectorAll(".tlink");
  for (let i = 0; i < chips.length; i++){
    (function(ch){
      ch.addEventListener("click", function(ev){ ev.preventDefault(); setTheme(ch.getAttribute("data-set-theme")); });
    })(chips[i]);
  }
})();

function drawSealMark(ctx, cx, cy, r){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.14);
  ctx.beginPath(); ctx.arc(3, 4, r, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(94,23,14,.55)"; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = "#7E241C"; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = "#5E170E"; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, Math.PI * 2);
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(243,226,188,.65)"; ctx.stroke();
  ctx.strokeStyle = "#F3E2BC"; ctx.lineWidth = Math.max(4, r * 0.11); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, -r * 0.52); ctx.lineTo(0, r * 0.28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r * 0.30, -r * 0.26); ctx.lineTo(r * 0.30, -r * 0.26); ctx.stroke();
  ctx.fillStyle = "#F3E2BC";
  ctx.font = "bold " + Math.round(r * 0.30) + "px Georgia, 'Times New Roman', serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("MW", 0, r * 0.56);
  ctx.restore();
  ctx.textAlign = "left"; ctx.textBaseline = "top";
}

let currentDay = todayDayNumber();

function todayDayNumber(){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const n = Math.floor((now - start) / 86400000);
  return Math.min(365, Math.max(1, n));
}
function ordinalSuffix(n){
  if (n % 100 >= 11 && n % 100 <= 13) return "th";
  switch (n % 10){
    case 1: return "st";
    case 2: return "nd";
    case 3: return "rd";
    default: return "th";
  }
}
function dateLabelForDay(day){
  const names = ["January","February","March","April","May","June","July",
    "August","September","October","November","December"];
  const d = new Date(new Date().getFullYear(), 0, day);
  return names[d.getMonth()] + " " + d.getDate() + ordinalSuffix(d.getDate());
}
function getSaved(){
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY)) || [];
    if (!Array.isArray(raw)) return [];
    return raw.map(function(x){
      if (typeof x === "number") return x + ":afternoon";
      return x;
    }).filter(function(x){ return /^\d+:(morning|afternoon|evening)$/.test(x); });
  } catch(e){ return []; }
}

function fitHome(){
  const home = document.getElementById("view-home");
  if (!home || home.hidden) return;
  home.removeAttribute("data-fit");
  home.removeAttribute("data-flow");
  /* Fail safe (Nov 12, 2026): if the flex lock ever leaves a visible
     cover collapsed (an in-app WebKit once resolved 100dvh far below
     the visible height and the card blanked to its caption), fall
     back to plain block flow rather than show a void. */
  const collapsed = function(){
    const card = document.querySelector("#view-home .card");
    if (card && card.clientHeight < 200) return true;
    for (let i = 0; i < 3; i++){
      const c = document.getElementById("cover" + i);
      if (c && c.style.display !== "none" && c.clientHeight < 48) return true;
    }
    return false;
  };
  if (collapsed()){
    home.setAttribute("data-flow", "1");
    return;
  }
  let step = 0;
  const over = function(){
    for (let i = 0; i < 3; i++){
      const b = document.getElementById("phase" + i);
      if (b.classList.contains("open") &&
          b.scrollHeight > b.clientHeight + 1) return true;
      const c = document.getElementById("cover" + i);
      if (c.style.display !== "none"){
        if (c.scrollHeight > c.clientHeight + 1) return true;
        const cr = c.getBoundingClientRect();
        for (const ch of c.children){
          const r = ch.getBoundingClientRect();
          if (r.top < cr.top - 1 || r.bottom > cr.bottom + 1) return true;
        }
        const sr = c.parentElement.getBoundingClientRect();
        if (cr.bottom > sr.bottom + 1 || cr.top < sr.top - 1) return true;
        const kr = document.querySelector("#view-home .card").getBoundingClientRect();
        if (cr.bottom > kr.bottom + 1) return true;
      }
    }
    return false;
  };
  while (step < 5 && over()){
    step++;
    home.setAttribute("data-fit", String(step));
  }
  if (collapsed()){
    home.removeAttribute("data-fit");
    home.setAttribute("data-flow", "1");
  }
}

/* Click to reveal: the three phases open in order, a classic uncovering. */
let revealStep = 0;
const PHASE_NAMES = ["The Verse", "The Affirmation", "The Action"];
function resetVeil(){
  revealStep = 0;
  document.getElementById("view-home").classList.remove("has-open");
  for (let i = 0; i < 3; i++){
    const c = document.getElementById("cover" + i);
    c.style.display = "";
    c.setAttribute("aria-expanded", "false");
    c.classList.toggle("waiting", i > 0);
    document.getElementById("phase" + i).classList.remove("open");
  }
}
function revealPhase(i){
  if (i < revealStep) return;
  if (i > revealStep){
    const c = document.getElementById("cover" + i);
    c.classList.remove("shake");
    void c.offsetWidth;
    c.classList.add("shake");
    toast("The three phases open in order. Begin with " + PHASE_NAMES[revealStep] + ".");
    return;
  }
  const c = document.getElementById("cover" + i);
  c.style.display = "none";
  c.setAttribute("aria-expanded", "true");
  document.getElementById("phase" + i).classList.add("open");
  document.getElementById("view-home").classList.add("has-open");
  revealStep++;
  fitHome();
  if (revealStep < 3)
    document.getElementById("cover" + revealStep).classList.remove("waiting");
}

  });

/* The Bible tab: five versions (KJV, NKJV, WEB, ASV, BBE), each in its
   own file, fetched only when that version is chosen, so Home stays fast.
   The choice is remembered on the device, and the Home daily verse
   follows it. Reading only. */
const BIBLE_VERSIONS = [
  { id: "kjv", name: "KJV", file: "bible.json" },
  { id: "nkjv", name: "NKJV", file: "bible-nkjv.json" },
  { id: "web", name: "WEB", file: "bible-web.json" },
  { id: "asv", name: "ASV", file: "bible-asv.json" },
  { id: "bbe", name: "BBE", file: "bible-bbe.json" }
];
const BIBLE_VERSION_KEY = "dailyWordFrameBibleVersion";
const NKJV_COPY = "The Holy Bible, New King James Version\u00ae \u00a9 1982 by Thomas Nelson, Inc. All Rights Reserved";
let bibleVersion = "kjv";
try {
  const storedVersion = localStorage.getItem(BIBLE_VERSION_KEY);
  if (BIBLE_VERSIONS.some(function(v){ return v.id === storedVersion; })) bibleVersion = storedVersion;
} catch (err) {}
const bibleDataCache = {};
const bibleDataPending = {};
let BIBLE = null, bibleBook = 0, bibleChap = 1;
function bibleVersionMeta(id){
  return BIBLE_VERSIONS.find(function(v){ return v.id === id; });
}
function loadBibleData(id){
  if (bibleDataCache[id]) return Promise.resolve(bibleDataCache[id]);
  if (bibleDataPending[id]) return bibleDataPending[id];
  bibleDataPending[id] = fetch(bibleVersionMeta(id).file).then(function(r){ return r.json(); }).then(function(d){
    bibleDataCache[id] = d;
    delete bibleDataPending[id];
    return d;
  }).catch(function(){
    delete bibleDataPending[id];
    return null;
  });
  return bibleDataPending[id];
}
function markVersionButtons(){
  document.querySelectorAll(".verbtn").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-bible-version") === bibleVersion);
  });
}
function ensureBible(){
  const want = bibleVersion;
  if (bibleDataCache[want]){
    BIBLE = bibleDataCache[want];
    buildBiblePickers();
    renderBibleChapter();
    return;
  }
  document.getElementById("bibleBody").innerHTML =
    "<p class=\"bibleloading\">Loading the " + bibleVersionMeta(want).name + " Bible\u2026</p>";
  loadBibleData(want).then(function(d){
    if (bibleVersion !== want) return;
    if (!d){
      document.getElementById("bibleBody").innerHTML =
        "<p class=\"bibleloading\">The Bible could not be loaded. Check your connection and open the tab again.</p>";
      return;
    }
    BIBLE = d;
    buildBiblePickers();
    renderBibleChapter();
  });
}
function setBibleVersion(id){
  if (!bibleVersionMeta(id)) return;
  bibleVersion = id;
  try { localStorage.setItem(BIBLE_VERSION_KEY, id); } catch (err) {}
  markVersionButtons();
  BIBLE = bibleDataCache[id] || null;
  if (BIBLE){
    buildBiblePickers();
    renderBibleChapter();
  } else {
    ensureBible();
  }

}
function buildBiblePickers(){

function buildChapterPicker(){

function renderBibleChapter(highlightVerse){
  if (!BIBLE) return;
  const book = BIBLE.books[bibleBook];
  document.getElementById("bibleName").textContent = book.name + " " + bibleChap;
  document.getElementById("bookSel").value = bibleBook;

/* The daily verse follows the version picker. KJV is the DATA text itself,
   byte for byte; any other version is looked up by the segment's own
   reference, ranges joined in order. If a verse is absent or empty in the
   chosen version, the KJV text stands, honestly labelled. */
const REF_PATTERN = /^(.+) (\d+):(\d+)(?:-(\d+))?$/;
function lookupVerse(data, ref){
  const m = REF_PATTERN.exec(ref);
  if (!m || !data) return null;
  const chap = parseInt(m[2], 10), from = parseInt(m[3], 10), to = parseInt(m[4] || m[3], 10);
  for (let i = 0; i < data.books.length; i++){
    if (data.books[i].name === m[1]){
      const ch = data.books[i].chapters[chap - 1];
      if (!ch || to > ch.length) return null;
      const parts = [];
      for (let v = from; v <= to; v++){
        if (!ch[v - 1] || !ch[v - 1].trim()) return null;
        parts.push(ch[v - 1]);
      }
      return parts.join(" ");
    }
  }
  return null;
}
function resolveVerse(s){
  if (bibleVersion === "kjv") return { text: s.verse, label: s.ref + " (KJV)", nkjv: false };
  const data = bibleDataCache[bibleVersion];
  if (!data){
    loadBibleData(bibleVersion).then(function(){
      if (bibleDataCache[bibleVersion]) applyHomeVerse();
    });
    return { text: s.verse, label: s.ref + " (KJV)", nkjv: false };
  }
  const text = lookupVerse(data, s.ref);
  if (text === null) return { text: s.verse, label: s.ref + " (KJV)", nkjv: false };
  return { text: text, label: s.ref + " (" + bibleVersionMeta(bibleVersion).name + ")", nkjv: bibleVersion === "nkjv" };
}
function applyHomeVerse(){
  const e = DATA[currentDay - 1];
  if (!e) return;
  const r = resolveVerse(e[currentSlot]);
  document.getElementById("verseText").textContent = r.text;
  document.getElementById("verseRef").textContent = r.label;
  document.getElementById("homeNkjvNote").hidden = !r.nkjv;
}
(function wireBible(){
  document.getElementById("bookSel").addEventListener("change", function(){
    bibleBook = parseInt(this.value, 10);
    bibleChap = 1;
    buildChapterPicker();
    renderBibleChapter();
  });

    bibleChap = parseInt(this.value, 10);
    renderBibleChapter();
  });
  document.querySelectorAll(".verbtn").forEach(function(b){
    b.addEventListener("click", function(){
      setBibleVersion(b.getAttribute("data-bible-version"));
    });
  });
  document.getElementById("bibleNkjvNote").textContent = NKJV_COPY;
  document.getElementById("homeNkjvNote").textContent = NKJV_COPY;
  markVersionButtons();
  document.getElementById("todayVerseBtn").addEventListener("click", function(){
    const ref = DATA[currentDay - 1][currentSlot].ref;
    const m = REF_PATTERN.exec(ref);
    if (!m) return;
    const jump = function(){
      for (let i = 0; i < BIBLE.books.length; i++){
        if (BIBLE.books[i].name === m[1]){
          bibleBook = i;
          bibleChap = parseInt(m[2], 10);
          buildChapterPicker();
          renderBibleChapter(parseInt(m[3], 10));
          return;
        }
      }
    };
    if (BIBLE) jump();
    else {
      ensureBible();
      const wait = setInterval(function(){
        if (BIBLE){ clearInterval(wait); jump(); }
      }, 120);
    }
  });
})();
/* The clock watcher: the time of day follows the visitor's clock on its
   own, and when the date turns while the app stands open, the whole app
   rolls over to the new day, scheme, scene, and content included. */
let lastToday = todayDayNumber();
function clockTick(){
  const t = todayDayNumber();
  if (t !== lastToday){
    lastToday = t;
    followClock = true;
    currentSlot = slotForNow();
    render(t);
    return;
  }
  if (followClock){
    const s = slotForNow();
    if (s !== currentSlot){
      currentSlot = s;
      renderSlot();
    }
  }
}
setInterval(clockTick, 30000);
document.addEventListener("visibilitychange", function(){
  if (!document.hidden) clockTick();
});
function browseTo(day){
  followClock = true;
  currentSlot = slotForNow();
  render(day);
  showView("home");
}

document.getElementById("nextBtn").addEventListener("click", function(){

function wireSettingsDisclosure(btnId, panelId){

    btn.setAttribute("aria-expanded", open ? "false" : "true");
    panel.hidden = open;
  });
}

document.getElementById("saveBtn").addEventListener("click", function(){
  let saved = getSaved();

    setSaved(saved);
    toast("Day " + currentDay + " " + SLOTS[currentSlot].name.toLowerCase() + " removed from saved.");

document.getElementById("shareMenu").addEventListener("click", function(ev){

document.getElementById("shareTextBtn").addEventListener("click", function(){

    navigator.share({ title: "My Words", text: text }).catch(function(){});
  } else if(navigator.clipboard && navigator.clipboard.writeText){

      toast("Copied. Paste it anywhere to share.");
    }, function(){ toast("Copy failed on this device."); });

function wrapLines(ctx, text, maxWidth){
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = "";
  words.forEach(function(w){
    const test = line ? line + " " + w : w;
    if(!line || ctx.measureText(test).width <= maxWidth){ line = test; }
    else { lines.push(line); line = w; }
  });
  if(line) lines.push(line);
  return lines;
}
function buildCardCanvas(e, slotLabel){
  const rv = resolveVerse(e);
  const pal = cardPal();
  const W = 1080;
  const marginX = 92, topPad = pal.seal ? 330 : 104, bottomPad = 140;
  const slotH = 60;
  const maxW = W - marginX * 2;
  const measure = document.createElement("canvas").getContext("2d");
  let scale = 1, layout = null, H = 1920;
  for(let i = 0; i < 60; i++){
    const vs = Math.round(56 * scale), bs = Math.round(42 * scale);
    const labelH = 32 * scale + 22, refH = 42 * scale + 20, gap = 54 * scale;
    const divH = Math.round(42 * scale);
    measure.font = vs + "px Georgia, 'Times New Roman', serif";
    const verseLines = wrapLines(measure, rv.text, maxW);
    measure.font = bs + "px Georgia, 'Times New Roman', serif";
    const affLines = wrapLines(measure, e.affirmation, maxW);
    const actLines = wrapLines(measure, e.action, maxW);
    const contentH = labelH + verseLines.length * vs * 1.42 + divH + refH + gap +
      labelH + affLines.length * bs * 1.5 + gap +
      labelH + actLines.length * bs * 1.5;
    layout = { scale: scale, vs: vs, bs: bs, labelH: labelH, refH: refH, gap: gap, divH: divH,
      verseLines: verseLines, affLines: affLines, actLines: actLines };
    if(topPad + slotH + contentH + bottomPad <= 1920){ H = 1920; break; }
    if(scale <= 0.5){ H = Math.ceil(topPad + slotH + contentH + bottomPad); break; }
    scale = Math.round((scale - 0.025) * 1000) / 1000;
  }
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  if(pal.stops){
    const mg = ctx.createLinearGradient(0, 0, W, H);
    const pos = [0, .22, .40, .58, .78, 1];
    for(let i = 0; i < pal.stops.length; i++) mg.addColorStop(pos[i], pal.stops[i]);
    mg.addColorStop(1, pal.stops[1]);
    ctx.fillStyle = mg;
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, pal.bgA);
    grad.addColorStop(1, pal.bgB);
    ctx.fillStyle = grad;
  }
  ctx.fillRect(0, 0, W, H);
  if(pal.fiber){
    ctx.fillStyle = "rgba(122,90,40,.045)";
    for(let fy = 60; fy < H; fy += 7) ctx.fillRect(0, fy, W, 1);
    ctx.fillStyle = "rgba(122,90,40,.035)";
    for(let fx = 48; fx < W; fx += 9) ctx.fillRect(fx, 0, 1, H);
  }
  if(pal.glow){
    const glow = ctx.createRadialGradient(W / 2, H * 0.30, 60, W / 2, H * 0.30, W * 0.9);
    pal.glow.forEach(function(g){ glow.addColorStop(g[0], g[1]); });
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.strokeStyle = pal.border;
  ctx.lineWidth = 3;
  ctx.strokeRect(34, 34, W - 68, H - 68);
  ctx.strokeStyle = pal.hairline;
  ctx.lineWidth = 1;
  ctx.strokeRect(50, 50, W - 100, H - 100);
  if(pal.seal) drawSealMark(ctx, W / 2, 196, 84);
  ctx.textBaseline = "top";
  ctx.textAlign = "left";
  let y = topPad;
  ctx.font = "bold 30px Georgia, 'Times New Roman', serif";
  try { ctx.letterSpacing = "5px"; } catch(err){}
  ctx.fillStyle = pal.label;
  ctx.textAlign = "center";
  ctx.fillText(String(slotLabel || "").toUpperCase(), W / 2, y + 2);
  try { ctx.letterSpacing = "0px"; } catch(err){}
  ctx.textAlign = "left";
  y += slotH;
  const s = layout.scale;
  function drawLabel(txt){
    ctx.font = "bold " + Math.round(32 * s) + "px Georgia, 'Times New Roman', serif";
    ctx.fillStyle = pal.label;
    ctx.fillText(txt, marginX, y);
    const tw = ctx.measureText(txt).width;
    const ly = y + Math.round(17 * s);
    const lg = ctx.createLinearGradient(marginX + tw + 26, 0, W - marginX, 0);
    lg.addColorStop(0, pal.rule);
    lg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.strokeStyle = lg;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(marginX + tw + 26, ly);
    ctx.lineTo(W - marginX, ly);
    ctx.stroke();
    y += layout.labelH;
  }
  function drawLines(arr, size, lh, color){
    ctx.font = size + "px Georgia, 'Times New Roman', serif";
    ctx.fillStyle = color;
    arr.forEach(function(ln){ ctx.fillText(ln, marginX, y); y += size * lh; });
  }
  function drawDivider(){
    const len = Math.round(210 * s), cy = y + Math.round(13 * s);
    const dg = ctx.createLinearGradient(marginX, 0, marginX + len, 0);
    dg.addColorStop(0, pal.divA);
    dg.addColorStop(1, pal.divB);
    ctx.strokeStyle = dg;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(marginX, cy);
    ctx.lineTo(marginX + len, cy);
    ctx.stroke();
    ctx.save();
    ctx.translate(marginX + len / 2, cy);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = pal.diamond;
    const d = Math.round(10 * s);
    ctx.fillRect(-d / 2, -d / 2, d, d);
    ctx.restore();
    y += layout.divH;
  }
  drawLabel("THE VERSE");
  drawLines(layout.verseLines, layout.vs, 1.42, pal.verse);
  drawDivider();
  ctx.font = "italic " + Math.round(38 * s) + "px Georgia, 'Times New Roman', serif";
  ctx.fillStyle = pal.ref;
  ctx.fillText(rv.label, marginX, y + 6);
  y += layout.refH + layout.gap;
  drawLabel("THE AFFIRMATION");
  drawLines(layout.affLines, layout.bs, 1.5, pal.body);
  y += layout.gap;
  drawLabel("THE ACTION");
  drawLines(layout.actLines, layout.bs, 1.5, pal.body);
  ctx.save();
  ctx.translate(W / 2, H - 130);
  ctx.rotate(Math.PI / 4);
  ctx.fillStyle = pal.footDiamond;
  ctx.fillRect(-5, -5, 10, 10);
  ctx.restore();
  ctx.font = Math.round(36 * s) + "px Georgia, 'Times New Roman', serif";
  try { ctx.letterSpacing = Math.round(6 * s) + "px"; } catch(err){}
  ctx.fillStyle = pal.foot;
  ctx.textAlign = "center";
  ctx.fillText("My Words", W / 2, H - 96);
  if (rv.nkjv){
    ctx.font = "20px Georgia, 'Times New Roman', serif";
    ctx.fillText(NKJV_COPY, W / 2, H - 48);
  }
  try { ctx.letterSpacing = "0px"; } catch(err){}
  ctx.textAlign = "left";
  return canvas;
}

function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toast("Picture saved. Share it from your downloads.");
}
document.getElementById("sharePicBtn").addEventListener("click", function(){
  closeShareMenu();
  const e = DATA[currentDay - 1][currentSlot];
  let canvas;
  try { canvas = buildCardCanvas(e, SLOTS[currentSlot].name + ": " + SLOTS[currentSlot].title); }
  catch(err){ toast("Picture could not be made on this device."); return; }
  const fileName = "mywords-day-" + currentDay + "-" + currentSlot + ".png";
  canvas.toBlob(function(blob){
    if(!blob){ toast("Picture could not be made on this device."); return; }
    let usedShare = false;
    if(navigator.canShare && window.File && navigator.share){
      try {
        const file = new File([blob], fileName, { type: "image/png" });
        if(navigator.canShare({ files: [file] })){
          usedShare = true;
          navigator.share({ files: [file], title: "My Words" }).catch(function(err){
            if(!err || err.name !== "AbortError") downloadBlob(blob, fileName);
          });
        }
      } catch(err){ usedShare = false; }
    }
    if(!usedShare) downloadBlob(blob, fileName);
  }, "image/png");
});
render(currentDay);
if (bibleVersion !== "kjv") loadBibleData(bibleVersion).then(function(){ if (bibleDataCache[bibleVersion]) applyHomeVerse(); });
